<!DOCTYPE html>
<html lang="ja">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- 页面标题 -->
     <title>管理者ログイン - JEC Food Rescue</title>
     <!-- 引入 Bootstrap 5 样式库 -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <!-- 引入 Bootstrap 图标库 -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <!-- 引入系统管理员端统一样式 -->
     <link rel="stylesheet" href="../css/style.css">
</head>

<body class="top-hero-bg d-flex flex-column min-vh-100">

     <!-- 主体居中登录区 -->
     <main class="container my-auto py-5">
          <div class="row justify-content-center">
               <div class="col-12 col-sm-10 col-md-7 col-lg-5">

                    <!-- 半透明柔光卡片 -->
                    <div class="hero-glass-card p-4 p-md-5">

                         <!-- 顶部大 Logo 与「ログイン」标题 -->
                         <div class="text-center mb-3">
                              <img src="../../images/logo.png" alt="JEC Food Rescue おいしさを、もう一度。" class="img-fluid mb-3"
                                   style="max-height: 135px;">
                              <h1 class="h4 fw-bold mb-0" style="color: #4a3525;">ログイン</h1>
                         </div>

                         <!-- 分隔线 -->
                         <hr class="my-4" style="border-color: rgba(107, 76, 53, 0.16);">

                         <!-- 登录表单：提交后直接进入系统管理员后台主画面 ../main/main.html -->
                         <form action="../main/main.html" method="get">
                              <div class="mb-3">
                                   <label for="adminEmail" class="form-label fw-bold" style="color: #4a3525;">メールアドレス</label>
                                   <input type="email" class="form-control py-2" id="adminEmail" placeholder="example@shop.jp">
                              </div>

                              <div class="mb-4">
                                   <label for="adminPassword" class="form-label fw-bold" style="color: #4a3525;">パスワード</label>
                                   <input type="password" class="form-control py-2" id="adminPassword" placeholder="パスワードを入力">
                              </div>

                              <!-- 底部双按钮：ログイン / 戻る -->
                              <div class="d-grid gap-2 pt-2">
                                   <button type="submit" class="btn btn-rescue-primary py-2 fw-bold rounded-3">
                                        ログイン
                                   </button>
                                   <a href="../../index.html" class="btn btn-outline-secondary py-2 rounded-3">
                                        戻る
                                   </a>
                              </div>
                         </form>

                    </div>

               </div>
          </div>
     </main>

     <!-- 底部版本版权信息 -->
     <footer class="text-center pb-4">
          <small class="text-secondary">v1.0 &nbsp; © 2026 JEC Food Rescue</small>
     </footer>

     <!-- 引入 Bootstrap 交互逻辑所需的 JavaScript 库 -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
