<!DOCTYPE html>
<html lang="ja">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- 【页面标题】修改为当前页面的名称 -->
     <title>商品マスターの編集 - JEC Food Rescue</title>
     <!-- 加载 Bootstrap 5 核心样式库 -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <!-- 加载 Bootstrap 图标库 -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <!-- 加载自定义的 CSS 样式 -->
     <link rel="stylesheet" href="../css/style.css">
</head>

<!-- 将整个页面的背景设置为浅灰色 -->

<body class="bg-light">

     <!-- 将“侧边栏”与“右侧内容区”横向并排
     min-vh-100：让侧边栏的高度至少撑满整个屏幕的高度 -->
     <div class="d-flex min-vh-100">

          <!-- 侧边栏 -->
          <div class="offcanvas-lg offcanvas-start bg-white border-end flex-shrink-0" id="sidebar">

               <!-- 仅在小屏幕打开侧边栏时显示的“菜单”标题与“×”关闭按钮 -->
               <div class="offcanvas-header d-lg-none">
                    <h5 class="offcanvas-title">メニュー</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="閉じる"></button>
               </div>

               <!-- 菜单主体内容 -->
               <div class="offcanvas-body d-flex flex-column p-3">

                    <!-- 标题 Logo（点击可跳转至主菜单） -->
                    <a href="../main/main.html" class="d-block mb-2 text-decoration-none link-body-emphasis">
                         <div class="fw-bold">JEC Food Rescue</div>
                         <small class="text-secondary">システム管理</small>
                    </a>

                    <!-- 【1. メイン】 -->
                    <nav class="nav nav-pills flex-column">
                         <a class="nav-link link-body-emphasis" href="../main/main.html"><i class="bi bi-house me-2"></i>メイン</a>
                    </nav>

                    <!-- 【2. 第一组：審査】 -->
                    <p class="small fw-bold text-secondary mt-3 mb-1 ms-2">審査</p>
                    <nav class="nav nav-pills flex-column">
                         <a class="nav-link link-body-emphasis" href="../shop/shop.html"><i class="bi bi-shop me-2"></i>店舗管理</a>
                         <a class="nav-link link-body-emphasis" href="../product-request/product-request.html"><i class="bi bi-plus-square me-2"></i>商品登録依頼</a>
                    </nav>

                    <!-- 【3. 第二组：管理】 -->
                    <p class="small fw-bold text-secondary mt-3 mb-1 ms-2">管理</p>
                    <nav class="nav nav-pills flex-column">
                        <!-- <a class="nav-link link-body-emphasis" href="../account/account.html"><i class="bi bi-people me-2"></i>アカウント管理</a>-->
                         <!-- 【当前所属页面高亮】保持 active -->
                         <a class="nav-link active" href="product.html"><i class="bi bi-tag me-2"></i>商品マスター</a>
                        <!-- <a class="nav-link link-body-emphasis" href="../review/review.html"><i class="bi bi-flag me-2"></i>レビュー管理</a>
                         <a class="nav-link link-body-emphasis" href="../faq/faq.html"><i class="bi bi-question-circle me-2"></i>FAQ管理</a>-->
                    </nav>

                    <!-- 【4. 第三组：サポート】 -->
                    <!--<p class="small fw-bold text-secondary mt-3 mb-1 ms-2">サポート</p>
                    <nav class="nav nav-pills flex-column">
                         <a class="nav-link link-body-emphasis" href="../contact/contact.html"><i class="bi bi-chat-left-text me-2"></i>お問い合わせ</a>
                    </nav> -->

                    <hr>
                    <a class="nav-link link-body-emphasis" href="../login/login.html"><i class="bi bi-box-arrow-left me-2"></i>ログアウト</a>
               </div>
          </div>
          <!--  侧边栏到此结束 -->

          <!-- 右侧内容区 -->
          <div class="flex-grow-1 overflow-hidden">

               <!-- 顶部导航栏 -->
               <header class="d-flex align-items-center border-bottom bg-white px-3" style="min-height: 48px;">
                    <button class="btn btn-outline-secondary btn-sm d-lg-none me-2" type="button"
                         data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="メニュー">
                         <i class="bi bi-list"></i>
                    </button>
               </header>

               <!-- 画面主要内容展示区 -->
               <main class="container-fluid p-4">

                    <!-- 页面标题行 -->
                    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
                         <div>
                              <h1 class="h3 fw-bold mb-1">商品マスターの編集</h1>
                              <p class="text-secondary mb-0">商品マスター情報の変更・無効化を行えます</p>
                         </div>
                    </div>

                    <!-- 【编辑更新表单】
                    此处 action 指向已有的 product.html，后续接 PHP 时只需把 action="product.html" 改为 action="update_product.php" 即可 -->
                    <div class="card shadow-sm">
                         <div class="card-body p-4">
                              <form id="updateForm" action="product.html" method="get">

                                   <!-- 隐藏域：保存后续 PHP 需要的参数 (写好保留，不影响前端) -->
                                   <input type="hidden" name="action_type" value="update">
                                   <input type="hidden" name="product_id" value="PRD-00001">

                                   <!-- 1. 商品ID -->
                                   <div class="mb-3">
                                        <label for="productId" class="form-label fw-bold">商品ID</label>
                                        <input type="text" class="form-control" id="productId" value="PRD-00001" readonly>
                                   </div>

                                   <!-- 2. 商品名 -->
                                   <div class="mb-3">
                                        <label for="productName" class="form-label fw-bold">商品名</label>
                                        <input type="text" class="form-control" id="productName" name="product_name" value="日替わり特製弁当（数量限定）" required>
                                   </div>

                                   <!-- 3. バーコード -->
                                   <div class="mb-3">
                                        <label for="barcode" class="form-label fw-bold">バーコード</label>
                                        <input type="text" class="form-control" id="barcode" name="barcode" value="4901234567890">
                                   </div> 

                                   <!-- 4. カテゴリ -->
                                   <div class="mb-3">
                                        <label for="category" class="form-label fw-bold">カテゴリ</label>
                                        <input type="text" class="form-control" id="category" name="category" value="お弁当・惣菜">
                                   </div>

                                   <!-- 5. 内容量(g) -->
                                   <div class="mb-3">
                                        <label for="volume" class="form-label fw-bold">内容量(g)</label>
                                        <input type="number" class="form-control" id="volume" name="volume" value="450">
                                   </div>

                                   <div class="mb-3">
                                        <label for="editStorageMethod" class="form-label fw-bold">保存方法</label>
                                        <select class="form-select" id="editStorageMethod" name="storage_method">
                                             <option value="" disabled>保存方法を選択してください</option>
                                             <option value="常温" selected>常温</option>
                                             <option value="冷蔵（10℃以下）">冷蔵（10℃以下）</option>
                                             <option value="冷凍">冷凍</option>
                                        </select>
                                   </div>

                                   <!-- 6. 商品画像 -->
                                   <div class="mb-3">
                                        <label for="productImage" class="form-label fw-bold">商品画像</label>
                                        <input class="form-control" type="file" id="productImage" name="product_image" accept="image/*">
                                   </div>

                                   <!-- 7. アレルゲン -->
                                   <div class="mb-4">
                                        <label for="allergen" class="form-label fw-bold">アレルゲン</label>
                                        <input type="text" class="form-control" id="allergen" name="allergen" value="小麦、卵、大豆">
                                   </div>

                                   <div class="mb-4">
                                        <label for="editDescription" class="form-label fw-bold">商品説明</label>
                                        <textarea class="form-control" id="editDescription" name="description" rows="4" placeholder="商品の特徴や注意事項などを入力してください">北海道産発酵バターを贅沢に使用し、外はサクサク、中はしっとり焼き上げたクロワッサンです。</textarea>
                                   </div>

                                   <hr class="my-4">

                                   <!-- 按钮操作区 -->
                                   <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center">
                                        <!-- 1. 確認して登録：点击直接提交表单并跳转回列表页 product.html -->
                                        <div>
                                             <button type="submit" class="btn btn-dark px-4 py-2">確認して登録</button>
                                        </div>

                                        <div class="d-flex gap-2">
                                             <!-- 2. 商品マスターを無効化：触发 Modal 模态确认弹窗 -->
                                             <button type="button" class="btn btn-outline-danger px-4 py-2" data-bs-toggle="modal" data-bs-target="#disableModal">
                                                  商品マスターを無効化
                                             </button>
                                             <!-- 3. 一覧へ：页面跳转链接 -->
                                             <a href="product.html" class="btn btn-outline-secondary px-4 py-2">一覧へ</a>
                                        </div>
                                   </div>

                              </form>
                         </div>
                    </div>

               </main>
          </div>
          <!--  右侧内容区到此结束 -->
     </div>

     <!-- 【禁用确认弹窗】 -->
     <div class="modal fade" id="disableModal" tabindex="-1" aria-labelledby="disableModalLabel" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered">
               <div class="modal-content">
                    <div class="modal-header">
                         <h5 class="modal-title fw-bold text-danger" id="disableModalLabel"><i class="bi bi-exclamation-triangle-fill me-2"></i>確認</h5>
                         <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                         この商品マスターを無効化してもよろしいですか？
                    </div>
                    <div class="modal-footer">
                         <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                         <!-- 点击“無効化する”跳转回列表页 product.html -->
                         <a href="product.html" class="btn btn-danger">無効化する</a>
                    </div>
               </div>
          </div>
     </div>

     <!-- 加载 Bootstrap 官方 JS 交互逻辑库 -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
