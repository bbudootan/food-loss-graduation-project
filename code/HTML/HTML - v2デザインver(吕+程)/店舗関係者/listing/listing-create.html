                    <p class="small fw-bold text-secondary mt-3 mb-1 ms-2">販売</p>
                    <nav class="nav nav-pills flex-column">

                         <a class="nav-link active" href="../listing/listing.html"><i class="bi bi-box-seam me-2"></i>出品・在庫</a>
                    </nav>

                    <!-- 暂时隐藏「商品」和「店舗」分组
                    <p class="small fw-bold text-secondary mt-3 mb-1 ms-2">商品</p>
                    <nav class="nav nav-pills flex-column">

          </div>

          <!-- 右侧内容区 -->
          <div class="flex-grow-1 overflow-hidden">
               <header class="d-flex align-items-center border-bottom bg-white px-3" style="min-height: 48px;">
                    <button class="btn btn-outline-secondary btn-sm d-lg-none me-2" type="button"
                         data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="メニュー">
                         <i class="bi bi-list"></i>
                    </button>
               </header>

               <main class="container-fluid p-4">

                    <!-- 页面标题行 -->
                    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4 pb-2 border-bottom">
                         <div>
                              <h1 class="h3 fw-bold mb-1">出品設定</h1>
                              <p class="text-secondary mb-0">販売価格・数量・食品期限を設定して商品を出品します</p>
                         </div>
                    </div>

                    <!-- 【出品设定主卡片】 -->
                    <div class="card shadow-sm">
                         <div class="card-body p-4">

                              <!-- 上半部分边框盒：商品マスターから取得 -->
                              <div class="border rounded p-4 mb-4 bg-light">
                                   <h2 class="h6 fw-bold text-secondary mb-3 pb-2 border-bottom">商品マスターから取得</h2>

                                   <div class="row g-3">
                                        <div class="col-12 col-md-6">
                                             <div class="small text-secondary fw-bold">商品ID</div>
                                             <div class="fw-bold">PRD-00001</div>
                                        </div>
                                        <div class="col-12 col-md-6">
                                             <div class="small text-secondary fw-bold">商品名</div>
                                             <div class="fw-bold">北海道産バターのクロワッサン</div>
                                        </div>
                                        <div class="col-12 col-md-6">
                                             <div class="small text-secondary fw-bold">カテゴリ</div>
                                             <div>パン・ベーカリー</div>
                                        </div>
                                        <div class="col-12 col-md-6">
                                             <div class="small text-secondary fw-bold">重量(g)</div>
                                             <div>85g</div>
                                        </div>
                                   </div>
                              </div>

                              <!-- 下半部分输入表单 -->
                              <form>
                                   <div class="row g-3 mb-3">
                                        <!-- 通常価格 -->
                                        <div class="col-12 col-md-6">
                                             <label for="normalPrice" class="form-label fw-bold">通常価格（円）</label>
                                             <input type="number" class="form-control" id="normalPrice" placeholder="例：300">
                                        </div>

                                        <!-- 販売価格 -->
                                        <div class="col-12 col-md-6">
                                             <label for="salePrice" class="form-label fw-bold">販売価格（円）</label>
                                             <input type="number" class="form-control" id="salePrice" placeholder="例：180">
                                        </div>
                                   </div>

                                   <div class="row g-3 mb-3">
                                        <!-- 数量 -->
                                        <div class="col-12 col-md-6">
                                             <label for="stockQuantity" class="form-label fw-bold">数量</label>
                                             <input type="number" class="form-control" id="stockQuantity" placeholder="例：10">
                                        </div>

                                        <!-- 食品期限 -->
                                        <div class="col-12 col-md-6">
                                             <label for="expiryDate" class="form-label fw-bold">食品期限</label>
                                             <input type="datetime-local" class="form-control" id="expiryDate">
                                        </div>
                                   </div>

                                   <!-- 出品説明 -->
                                  <!-- <div class="mb-4">
                                        <label for="listingDesc" class="form-label fw-bold">出品説明</label>
                                        <textarea class="form-control" id="listingDesc" rows="3" placeholder="例：本日焼き上げたクロワッサンです。温め直すとより美味しくお召し上がりいただけます。"></textarea>
                                   </div>-->

                                   <!-- 底部操作按钮：出品する / 戻る -->
                                   <div class="d-flex flex-wrap gap-3">
                                        <button type="button" class="btn btn-dark px-5 py-2" data-bs-toggle="modal" data-bs-target="#publishConfirmModal">
                                             出品する
                                        </button>
                                        <a href="listing-select.html" class="btn btn-outline-secondary px-4 py-2">
                                             商品選択に戻る
                                        </a>
                                   </div>
                              </form>

                         </div>
                    </div>

               </main>
          </div>
     </div>

     <!-- 弹窗：出品する 确认弹窗 -->
     <div class="modal fade" id="publishConfirmModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered">
               <div class="modal-content">
                    <div class="modal-header">
                         <h5 class="modal-title fw-bold">出品確認</h5>
                         <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                         入力した内容で商品の<strong>出品</strong>を公開してもよろしいですか？
                    </div>
                    <div class="modal-footer">
                         <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                         <a href="listing.html" class="btn btn-dark">出品を確定する</a>
                    </div>
               </div>
          </div>
     </div>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
