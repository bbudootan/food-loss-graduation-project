<!DOCTYPE html>
<html lang="ja">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>商品登録依頼 - JEC Food Rescue</title>
     <!-- 引入 Bootstrap 5 样式库 -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <!-- 引入 Bootstrap 图标库 -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <!-- 引入店铺端全局统一样式 -->
     <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

     <div class="d-flex min-vh-100">

          <!-- 左侧固定导航侧边栏 -->
          <div class="offcanvas-lg offcanvas-start bg-white border-end flex-shrink-0" id="sidebar">
               <div class="offcanvas-header d-lg-none">
                    <h5 class="offcanvas-title">メニュー</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="閉じる"></button>
               </div>

               <div class="offcanvas-body d-flex flex-column p-3">
                    <!-- 品牌 Logo 区（小 Logo + 换行显示「店舗管理」） -->
                    <a href="../main/main.html" class="d-flex align-items-center gap-2 mb-3 text-decoration-none link-body-emphasis">
                         <img src="../../images/logo-small.png" alt="JEC" style="height: 40px; width: auto;">
                         <div class="lh-sm">
                              <div class="fs-6 fw-bold" style="color: #4a3525;">JEC Food Rescue</div>
                              <div class="small text-secondary mt-1">店舗管理</div>
                         </div>
                    </a>

                    <nav class="nav nav-pills flex-column">
                         <a class="nav-link link-body-emphasis" href="../main/main.html">
                              <i class="bi bi-house me-2"></i>メイン
                         </a>
                    </nav>

                    <p class="small fw-bold text-secondary mt-3 mb-1 ms-2">販売</p>
                    <nav class="nav nav-pills flex-column">
                         <a class="nav-link link-body-emphasis" href="../pickup/pickup.html">
                              <i class="bi bi-pencil-square me-2"></i>受け取り確認
                         </a>
                         <a class="nav-link link-body-emphasis" href="../orders/orders.html">
                              <i class="bi bi-receipt me-2"></i>注文管理
                         </a>
                         <a class="nav-link active" href="listing.html">
                              <i class="bi bi-box-seam me-2"></i>出品・在庫
                         </a>
                    </nav>

                    <hr>
                    <a class="nav-link link-body-emphasis" href="../login/login.html">
                         <i class="bi bi-box-arrow-left me-2"></i>ログアウト
                    </a>
               </div>
          </div>

          <!-- 右侧主内容区域 -->
          <div class="flex-grow-1 overflow-hidden">
               <!-- 移动端顶部菜单栏 -->
               <header class="d-flex align-items-center border-bottom bg-white px-3" style="min-height: 48px;">
                    <button class="btn btn-outline-secondary btn-sm d-lg-none me-2" type="button"
                         data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="メニュー">
                         <i class="bi bi-list"></i>
                    </button>
               </header>

               <main class="container-fluid p-4">

                    <!-- 页面标题与返回按钮 -->
                    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4 pb-2 border-bottom">
                         <div>
                              <h1 class="h3 fw-bold mb-1">商品登録依頼</h1>
                              <p class="text-secondary mb-0">商品の写真と表示写真（バーコード・容量など）をアップロードして登録を依頼します</p>
                         </div>
                         <a href="listing.html" class="btn btn-outline-secondary px-3 py-2">
                              ← 出品・在庫一覧へ戻る
                         </a>
                    </div>

                    <!-- 主体上传表单卡片（仅保留两张照片上传 + 送信按钮，已去掉手入力部分） -->
                    <div class="row justify-content-center">
                         <div class="col-12 col-lg-9 col-xl-8">
                              <div class="card shadow-sm">
                                   <div class="card-body p-4 p-md-5">

                                        <!-- 1. 商品の写真 -->
                                        <div class="border rounded-3 p-4 mb-4 bg-white">
                                             <h2 class="h5 fw-bold mb-3">商品の写真</h2>
                                             <label for="productPhoto"
                                                    class="d-block border border-2 rounded-3 p-4 text-center bg-light"
                                                    style="cursor: pointer; border-style: dashed !important;">
                                                  <i class="bi bi-camera fs-2 text-secondary d-block mb-2"></i>
                                                  <span class="btn btn-outline-dark px-4 mb-2">ファイルを選択</span>
                                                  <div id="productPhotoName" class="small text-secondary">選択されていません（JPG / PNG）</div>
                                             </label>
                                             <input type="file" id="productPhoto" class="d-none" accept="image/*"
                                                    onchange="showFileName(this, 'productPhotoName')">
                                        </div>

                                        <!-- 2. 商品の表示写真（バーコード・容量など） -->
                                        <div class="border rounded-3 p-4 mb-4 bg-white">
                                             <h2 class="h5 fw-bold mb-3">商品の表示写真（バーコード・容量など）</h2>
                                             <label for="labelPhoto"
                                                    class="d-block border border-2 rounded-3 p-4 text-center bg-light"
                                                    style="cursor: pointer; border-style: dashed !important;">
                                                  <i class="bi bi-upc-scan fs-2 text-secondary d-block mb-2"></i>
                                                  <span class="btn btn-outline-dark px-4 mb-2">ファイルを選択</span>
                                                  <div id="labelPhotoName" class="small text-secondary">選択されていません（JPG / PNG）</div>
                                             </label>
                                             <input type="file" id="labelPhoto" class="d-none" accept="image/*"
                                                    onchange="showFileName(this, 'labelPhotoName')">
                                        </div>

                                        <!-- 3. 底部「登録依頼を送信」按钮（点击弹出送信完成确认框） -->
                                        <div class="text-center pt-2">
                                             <button type="button" class="btn btn-dark btn-lg px-5 py-2 fw-bold"
                                                     data-bs-toggle="modal" data-bs-target="#requestCompleteModal">
                                                  登録依頼を送信
                                             </button>
                                        </div>

                                   </div>
                              </div>
                         </div>
                    </div>

               </main>
          </div>

     </div>

     <!-- 送信完成弹窗：点击「登録依頼を送信」后弹出，点击确定后跳回 listing.html -->
     <div class="modal fade" id="requestCompleteModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered">
               <div class="modal-content">
                    <div class="modal-body text-center p-5">
                         <div class="mb-3" style="color: #789f35;">
                              <i class="bi bi-check-circle" style="font-size: 4rem;"></i>
                         </div>
                         <h5 class="fw-bold mb-2">商品登録依頼を送信しました</h5>
                         <p class="text-secondary small mb-4">
                              システム管理者による審査・マスタ登録完了後、商品検索から出品できるようになります。
                         </p>
                         <a href="listing.html" class="btn btn-dark px-5 py-2">出品・在庫一覧へ戻る</a>
                    </div>
               </div>
          </div>
     </div>

     <!-- 引入 Bootstrap JS 库 -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
     <!-- 选择图片后显示文件名的轻量提示脚本 -->
     <script>
          function showFileName(input, targetId) {
               const label = document.getElementById(targetId);
               if (input.files && input.files.length > 0) {
                    label.textContent = '選択済み：' + input.files[0].name;
                    label.classList.remove('text-secondary');
                    label.classList.add('fw-bold', 'text-success');
               }
          }
     </script>

</body>

</html>
