<!DOCTYPE html>
<html lang="ja">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>出店申請の確認 - JEC Food Rescue</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <link rel="stylesheet" href="../css/style.css">
</head>

<body class="top-hero-bg d-flex flex-column min-vh-100">

     <!-- 顶部半透明导航栏 -->
     <header class="bg-white bg-opacity-75 border-bottom py-2 px-4 d-flex align-items-center justify-content-between"
             style="backdrop-filter: blur(6px);">
          <a href="login.html" class="d-flex align-items-center text-decoration-none">
               <img src="../../images/logo.png" alt="JEC Food Rescue" style="height: 44px;">
          </a>
          <span class="small fw-bold text-secondary">新規出店お申し込み</span>
     </header>

     <!-- 主体确认内容区 -->
     <main class="container py-5 flex-grow-1">
          <div class="row justify-content-center">
               <div class="col-12 col-lg-8">

                    <div class="hero-glass-card p-4 p-md-5">

                         <h1 class="h3 fw-bold mb-4 pb-2 border-bottom" style="color: #4a3525;">出店申請の確認</h1>

                         <!-- 【1. 店舗情報 确认框】 -->
                         <div class="bg-white rounded-4 border p-4 mb-4">
                              <h2 class="h5 fw-bold mb-4 pb-2 border-bottom" style="color: #4a3525;">店舗情報</h2>

                              <div class="mb-3 pb-2 border-bottom">
                                   <div class="small text-secondary fw-bold mb-1">店舗名</div>
                                   <div id="confirmShopName" class="fw-bold">ベーカリー太陽 新宿店</div>
                              </div>

                              <div class="mb-3 pb-2 border-bottom">
                                   <div class="small text-secondary fw-bold mb-1">店舗住所</div>
                                   <div id="confirmShopAddress">東京都新宿区西新宿1-1-1</div>
                              </div>

                              <div class="mb-3 pb-2 border-bottom">
                                   <div class="small text-secondary fw-bold mb-1">電話番号</div>
                                   <div id="confirmShopTel">03-1234-5678</div>
                              </div>

                              <div class="mb-3 pb-2 border-bottom">
                                   <div class="small text-secondary fw-bold mb-1">担当者名</div>
                                   <div id="confirmStaffName">山田 太郎</div>
                              </div>

                              <div class="mb-3 pb-2 border-bottom">
                                   <div class="small text-secondary fw-bold mb-1">開店時間 〜 閉店時間</div>
                                   <div><span id="confirmOpenTime">09:00</span> 〜 <span id="confirmCloseTime">20:00</span></div>
                              </div>

                              <div>
                                   <div class="small text-secondary fw-bold mb-1">店舗紹介</div>
                                   <div id="confirmShopIntro" style="white-space: pre-wrap;">毎日焼き立てのパンをお届けしています。食品ロス削減のため夕方にお得なセットを出品します。</div>
                              </div>
                         </div>

                         <!-- 【2. 承認後のログインに使う情報 确认框】 -->
                         <div class="bg-white rounded-4 border p-4 mb-4">
                              <h2 class="h5 fw-bold mb-4 pb-2 border-bottom" style="color: #4a3525;">承認後のログインに使う情報</h2>

                              <div class="mb-3 pb-2 border-bottom">
                                   <div class="small text-secondary fw-bold mb-1">メールアドレス</div>
                                   <div id="confirmApplyEmail">taiyo-shinjuku@example.jp</div>
                              </div>

                              <div class="mb-3 pb-2 border-bottom">
                                   <div class="small text-secondary fw-bold mb-1">パスワード</div>
                                   <div>••••••••</div>
                              </div>

                              <div>
                                   <div class="small text-secondary fw-bold mb-1">パスワード（確認）</div>
                                   <div>••••••••</div>
                              </div>
                         </div>

                         <!-- 底部双按钮 -->
                         <div class="d-flex flex-wrap gap-3">
                              <a href="apply-complete.html" class="btn btn-rescue-primary px-5 py-2 fw-bold rounded-3">この内容で申請</a>
                              <button type="button" class="btn btn-outline-secondary px-4 py-2 rounded-3" onclick="history.back()">入力に戻る</button>
                         </div>

                    </div>

               </div>
          </div>
     </main>

     <footer class="text-center pb-4">
          <small class="text-secondary">v1.0 &nbsp; © 2026 JEC Food Rescue</small>
     </footer>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
     <script>
          const p = new URLSearchParams(window.location.search);
          const setVal = (key, elId) => {
               const v = p.get(key);
               if (v && v.trim() !== '') document.getElementById(elId).textContent = v.trim();
          };
          setVal('shop_name', 'confirmShopName');
          setVal('shop_address', 'confirmShopAddress');
          setVal('shop_tel', 'confirmShopTel');
          setVal('staff_name', 'confirmStaffName');
          setVal('open_time', 'confirmOpenTime');
          setVal('close_time', 'confirmCloseTime');
          setVal('shop_intro', 'confirmShopIntro');
          setVal('apply_email', 'confirmApplyEmail');
     </script>
</body>

</html>
