<!DOCTYPE html>
<html lang="ja">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>店舗管理ログイン - JEC Food Rescue</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <link rel="stylesheet" href="../css/style.css">
</head>

<body class="top-hero-bg d-flex flex-column min-vh-100">

     <main class="container my-auto py-5">
          <div class="row justify-content-center">
               <div class="col-12 col-sm-10 col-md-7 col-lg-5">

                    <!-- 半透明柔光卡片 -->
                    <div class="hero-glass-card p-4 p-md-5">

                         <!-- 顶部 Logo -->
                         <div class="text-center mb-4">
                              <img src="../../images/logo.png" alt="JEC Food Rescue" class="img-fluid mb-2" style="max-height: 130px;">
                              <h1 class="h4 fw-bold mt-2 mb-0" style="color: #4a3525;">ログイン</h1>
                         </div>

                         <hr class="my-4" style="border-color: rgba(107, 76, 53, 0.18);">

                         <!-- 登录表单（直接跳转到 ../main/main.html） -->
                         <form action="../main/main.html" method="get">
                              <div class="mb-3">
                                   <label for="loginEmail" class="form-label fw-bold">メールアドレス</label>
                                   <input type="email" class="form-control" id="loginEmail" placeholder="example@shop.jp">
                              </div>

                              <div class="mb-4">
                                   <label for="loginPassword" class="form-label fw-bold">パスワード</label>
                                   <input type="password" class="form-control" id="loginPassword" placeholder="パスワードを入力">
                              </div>

                              <div class="d-grid gap-2 pt-2">
                                   <button type="submit" class="btn btn-rescue-primary py-2 fw-bold rounded-3">ログイン</button>
                                   <a href="login.html" class="btn btn-outline-secondary py-2 rounded-3">戻る</a>
                              </div>
                         </form>

                    </div>

               </div>
          </div>
     </main>

     <footer class="text-center pb-4">
          <small class="text-secondary">v1.0 &nbsp; © 2026 JEC Food Rescue</small>
     </footer>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
