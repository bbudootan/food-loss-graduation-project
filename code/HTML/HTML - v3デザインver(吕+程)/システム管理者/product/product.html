<!DOCTYPE html>
<html lang="ja">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- 【页面标题】修改为当前页面的名称 -->
     <title>商品マスター - JEC Food Rescue</title>
     <!-- 加载 Bootstrap 5 核心样式库 -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <!-- 加载 Bootstrap 图标库 -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <!-- 加载自定义的 CSS 样式 -->
     <link rel="stylesheet" href="../css/style.css">
</head>

<!-- 将整个页面的背景设置为浅灰色 -->

<body class="bg-light">

     <!-- 将“侧边栏”与“右侧内容区”横向并排
     min-vh-100：让侧边栏的高度至少撑满整个屏幕的高度 -->
     <div class="d-flex min-vh-100">

          <!-- 侧边栏
          offcanvas-lg   ：在大屏幕上，始终在左侧固定显示。在小屏幕上隐藏，点击按钮滑出
          offcanvas-start：在小屏幕滑出时，设置为从左侧边缘滑出
          flex-shrink-0  ：固定侧边栏宽度，不压缩侧边栏 -->
          <div class="offcanvas-lg offcanvas-start bg-white border-end flex-shrink-0" id="sidebar">

               <!-- 仅在小屏幕打开侧边栏时显示的“菜单”标题与“×”关闭按钮 -->
               <div class="offcanvas-header d-lg-none">
                    <h5 class="offcanvas-title">メニュー</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="閉じる"></button>
               </div>

               <!-- 菜单主体内容 -->
               <div class="offcanvas-body d-flex flex-column p-3">

                    <!-- 标题 Logo（点击可跳转至主菜单） -->
                    <a href="../main/main.html" class="d-flex align-items-center gap-2 mb-3 text-decoration-none link-body-emphasis">
               <img src="../../images/logo-small.png" alt="JEC" style="height: 40px; width: auto;">
               <div class="lh-sm">
               <div class="fs-6 fw-bold" style="color: #4a3525;">JEC Food Rescue</div>
               <div class="small text-secondary mt-1">システム管理</div>
               </div>
               </a>

                    <!-- 【1. メイン】 -->
                    <nav class="nav nav-pills flex-column">
                         <a class="nav-link link-body-emphasis" href="../main/main.html"><i class="bi bi-house me-2"></i>メイン</a>
                    </nav>

                    <!-- 【2. 第一组：審査】 -->
                    <p class="small fw-bold text-secondary mt-3 mb-1 ms-2">審査</p>
                    <nav class="nav nav-pills flex-column">
                         <a class="nav-link link-body-emphasis" href="../shop/shop.html"><i class="bi bi-shop me-2"></i>店舗管理</a>
                         <a class="nav-link link-body-emphasis" href="../product-request/product-request.html"><i class="bi bi-plus-square me-2"></i>商品登録依頼</a>
                    </nav>

                    <!-- 【3. 第二组：管理】（当前页面高亮：商品マスター） -->
                    <p class="small fw-bold text-secondary mt-3 mb-1 ms-2">管理</p>
                    <nav class="nav nav-pills flex-column">
                     <!--    <a class="nav-link link-body-emphasis" href="../account/account.html"><i class="bi bi-people me-2"></i>アカウント管理</a>-->
                         <!-- 【当前页面高亮】使用 active 类，图标改为最新的 bi-tag -->
                         <a class="nav-link active" href="product.html"><i class="bi bi-tag me-2"></i>商品マスター</a>
                     <!--    <a class="nav-link link-body-emphasis" href="../review/review.html"><i class="bi bi-flag me-2"></i>レビュー管理</a>
                         <a class="nav-link link-body-emphasis" href="../faq/faq.html"><i class="bi bi-question-circle me-2"></i>FAQ管理</a>-->
                    </nav>

                    <!-- 【4. 第三组：サポート】 -->
                   <!-- <p class="small fw-bold text-secondary mt-3 mb-1 ms-2">サポート</p>
                    <nav class="nav nav-pills flex-column">
                         <a class="nav-link link-body-emphasis" href="../contact/contact.html"><i class="bi bi-chat-left-text me-2"></i>お問い合わせ</a>
                    </nav> -->

                    <hr>
                    <a class="nav-link link-body-emphasis" href="../login/login.html"><i class="bi bi-box-arrow-left me-2"></i>ログアウト</a>
               </div>
          </div>
          <!--  侧边栏到此结束 -->

          <!-- 右侧内容区 -->
          <div class="flex-grow-1 overflow-hidden">

               <!-- 顶部导航栏 -->
               <header class="d-flex align-items-center border-bottom bg-white px-3" style="min-height: 48px;">
                    <button class="btn btn-outline-secondary btn-sm d-lg-none me-2" type="button"
                         data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="メニュー">
                         <i class="bi bi-list"></i>
                    </button>
               </header>

               <!-- 画面主要内容展示区 -->
               <main class="container-fluid p-4">

                    <!-- 页面标题行 -->
                    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
                         <div>
                              <h1 class="h3 fw-bold mb-1">商品マスター</h1>
                              <p class="text-secondary mb-0">登録済み商品情報の検索・編集ができます</p>
                         </div>
                    </div>

                    <!-- 【中间内容：1. 搜索框】 -->
                    <div class="card mb-4 shadow-sm">
                         <div class="card-body p-4">
                              <form class="row g-3 align-items-end">
                                   <div class="col-12 col-md-8">
                                        <label for="searchKeyword" class="form-label fw-bold">商品名・商品ID</label>
                                        <input type="text" class="form-control" id="searchKeyword" placeholder="商品名または商品IDを入力">
                                   </div>
                                   <div class="col-12 col-md-4 text-md-end">
                                        <button type="submit" class="btn btn-outline-dark px-4 w-100 w-md-auto">
                                             <i class="bi bi-search me-1"></i>検索
                                        </button>
                                   </div>
                              </form>
                         </div>
                    </div>

                    <!-- 【中间内容：2. 商品表格】 -->
                    <div class="card shadow-sm">
                         <div class="card-body p-0">
                              <div class="table-responsive">
                                   <table class="table table-hover align-middle mb-0 text-center">
                                        <thead class="table-light">
                                             <tr>
                                                  <th scope="col" style="width: 20%;">商品ID</th>
                                                  <th scope="col" style="width: 45%;">商品名</th>
                                                  <th scope="col" style="width: 15%;">状態</th>
                                                  <th scope="col" style="width: 20%;">操作</th>
                                             </tr>
                                        </thead>
                                        <tbody>
                                             <tr>
                                                  <td>PRD-00001</td>
                                                  <td class="text-start">日替わり特製弁当（数量限定）</td>
                                                  <td>
                                                       <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">有効</span>
                                                  </td>
                                                  <td>
                                                       <a href="product-detail.html" class="btn btn-outline-dark btn-sm px-3">編集</a>
                                                  </td>
                                             </tr>
                                             <tr>
                                                  <td>PRD-00002</td>
                                                  <td class="text-start">自家製焼き立てパンセット</td>
                                                  <td>
                                                       <span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle px-3 py-2">無効</span>
                                                  </td>
                                                  <td>
                                                       <a href="product-detail.html" class="btn btn-outline-dark btn-sm px-3">編集</a>
                                                  </td>
                                             </tr>
                                             <tr>
                                                  <td>PRD-00003</td>
                                                  <td class="text-start">オーガニック季節の野菜盛り合わせ</td>
                                                  <td>
                                                       <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">有効</span>
                                                  </td>
                                                  <td>
                                                       <a href="product-detail.html" class="btn btn-outline-dark btn-sm px-3">編集</a>
                                                  </td>
                                             </tr>
                                        </tbody>
                                   </table>
                              </div>
                         </div>
                    </div>

               </main>
          </div>
          <!--  右侧内容区到此结束 -->
     </div>

     <!-- 加载 Bootstrap 官方 JS 交互逻辑库 -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
