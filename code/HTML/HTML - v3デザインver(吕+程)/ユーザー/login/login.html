<!DOCTYPE html>
<html lang="ja">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>ログイン - JEC Food Rescue</title>
     <!-- Bootstrap 5 CSS -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <style>
          body {
               background-color: #F9F7F2;
               color: #3B281C;
               font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
          }
          .login-card {
               max-width: 480px;
               width: 100%;
               background-color: #FDFBF7;
               border: 1px solid #EAE4DA;
               border-radius: 16px;
               box-shadow: 0 4px 16px rgba(59, 40, 28, 0.04);
          }
          .btn-brown {
               background-color: #63432D;
               color: #FFFFFF;
               border: none;
               font-weight: bold;
               padding: 12px;
               border-radius: 8px;
          }
          .btn-brown:hover {
               background-color: #4E3422;
               color: #FFFFFF;
          }
          .btn-back {
               background-color: #FFFFFF;
               color: #666666;
               border: 1px solid #B5B5B5;
               padding: 11px;
               border-radius: 8px;
          }
          .btn-back:hover {
               background-color: #F3F3F3;
               color: #333333;
          }
          .form-control {
               padding: 11px 14px;
               border-radius: 8px;
               border-color: #DCDCDC;
          }
     </style>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

     <div class="login-card p-4 p-md-5">
          <!-- 顶部 Logo 与标题 -->
          <div class="text-center mb-4">
               <img src="../../images/logo.png" alt="JEC Food Rescue" style="max-height: 110px;" class="mb-3">
               <h1 class="h4 fw-bold mb-0">ログイン</h1>
          </div>

          <hr class="mb-4" style="border-color: #EAE4DA;">

          <!-- 用户登录表单（提交后直接跳转到 ユーザー/home.html） -->
          <form action="../home.html" onsubmit="sessionStorage.setItem('isLoggedIn', 'true')">
               <div class="mb-3">
                    <label for="email" class="form-label fw-bold small">メールアドレス</label>
                    <input type="email" class="form-control" id="email" placeholder="example@jec.ac.jp" required>
               </div>

               <div class="mb-4">
                    <label for="password" class="form-label fw-bold small">パスワード</label>
                    <input type="password" class="form-control" id="password" placeholder="パスワードを入力" required>
               </div>

               <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-brown">ログイン</button>
                    <a href="../index.html" class="btn btn-back text-center text-decoration-none">戻る</a>
               </div>
          </form>
     </div>

</body>
</html>
