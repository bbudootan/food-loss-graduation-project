<!DOCTYPE html>
<html lang="ja">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>店舗一覧 - JEC Food Rescue</title>
     <!-- Bootstrap 5 CSS -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <!-- Bootstrap Icons -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <!-- カスタムCSS / 自定义外部样式 -->
     <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

     <!-- 1. 共通ヘッダー挿入先 / 公共顶部导航栏占位 -->
     <div id="commonHeader"></div>

     <!-- 2. メインコンテンツ / 主内容区 -->
     <main class="container py-4 flex-grow-1">
          <!-- パンくずリスト / 面包屑导航 -->
          <nav aria-label="breadcrumb" class="mb-3">
               <ol class="breadcrumb small mb-0">
                    <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none text-secondary">ホーム</a></li>
                    <li class="breadcrumb-item active text-dark fw-bold">店舗一覧</li>
               </ol>
          </nav>

          <!-- タイトルと検索・絞り込みフォーム / 标题与店铺搜索筛选区 -->
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
               <h1 class="h5 fw-bold mb-0">加盟店舗一覧（<span id="shopCount">0</span>店舗）</h1>
               <form action="shops.php" method="GET" class="d-flex flex-wrap align-items-center gap-2" onsubmit="return false;">
                    <input type="text" name="keyword" class="form-control form-control-sm" id="shopSearchInput" placeholder="店舗名・エリアで検索" style="width: 190px;">
                    <select name="genre" class="form-select form-select-sm" id="shopGenreFilter" style="width: 155px;">
                         <option value="all" selected>すべてのジャンル</option>
                         <option value="ベーカリー">ベーカリー</option>
                         <option value="お弁当・惣菜">お弁当・惣菜</option>
                         <option value="スイーツ・洋菓子">スイーツ・洋菓子</option>
                    </select>
                    <button type="button" class="btn btn-brown btn-sm px-3" id="shopSearchBtn">
                         <i class="bi bi-search me-1"></i>検索
                    </button>
               </form>
          </div>

          <!-- 店舗カード一覧グリッド / 店铺卡片网格容器 -->
          <div class="row g-3 mb-4" id="shopGrid"></div>

          <!-- ホームへ戻るボタン / 返回首页按钮 -->
          <div class="text-center mt-3">
               <a href="index.html" class="btn btn-outline-brown btn-sm px-4 js-home-link">&larr; ホームへ戻る</a>
          </div>
     </main>

     <!-- 3. 共通フッター・ドロワー挿入先 / 公共页脚与双抽屉占位 -->
     <div id="commonFooter"></div>

     <!-- Bootstrap 5 JS -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
     <!-- ログイン状態判定・共通UIスクリプト / 登录状态判断与公共交互脚本 -->
     <script src="js/auth-state.js"></script>
     <script>
          // ダミー店舗データ配列（PHP化後はDBの shops テーブルから取得）
          // 模拟店铺数据数组（后续改用 PHP 后改为从数据库 shops 表读取）
          const SHOPS = [
               { name: 'ベーカリー太陽 新宿店', genre: 'ベーカリー', address: '東京都新宿区西新宿1-1-1', hours: '09:00〜20:30', count: 3, desc: '国産小麦と天然酵母を使った焼きたてパンの専門店', access: 'JR新宿駅 西口より徒歩3分', holiday: '毎週水曜日' },
               { name: 'キッチンみどり 西新宿店', genre: 'お弁当・惣菜', address: '東京都新宿区西新宿2-4-1', hours: '11:00〜21:00', count: 2, desc: '旬の国産野菜を使った手作り日替わり弁当とお惣菜', access: '都庁前駅 A2出口より徒歩2分', holiday: '土日祝' },
               { name: 'パティスリー森の風', genre: 'スイーツ・洋菓子', address: '東京都新宿区新宿3-15-8', hours: '10:00〜20:00', count: 4, desc: '季節の果実タルトと濃厚ショコラが人気の洋菓子店', access: '新宿三丁目駅 B5出口より徒歩1分', holiday: '毎週火曜日' },
               { name: 'こもれびベーカリー', genre: 'ベーカリー', address: '東京都新宿区百人町1-10-5', hours: '08:30〜19:30', count: 1, desc: '地元に愛される街の小さなパン屋さん。夕方詰め合わせセットが人気', access: '大久保駅 南口より徒歩2分', holiday: '毎週日曜日' }
          ];

          // 検索条件を適用して店舗カードを描画する関数
          // 根据搜索与品类条件过滤并渲染店铺卡片的函数
          function renderShops() {
               const kw = document.getElementById('shopSearchInput').value.trim().toLowerCase();
               const genre = document.getElementById('shopGenreFilter').value;

               const list = SHOPS.filter(s => (s.name + s.address + s.genre).toLowerCase().includes(kw) && (genre === 'all' || s.genre === genre));
               document.getElementById('shopCount').textContent = list.length;

               const grid = document.getElementById('shopGrid');
               if (!list.length) {
                    grid.innerHTML = '<div class="col-12 text-center py-5 text-secondary">条件に一致する店舗が見つかりませんでした。</div>';
                    return;
               }

               // 店舗カードHTML生成（「店舗概要 →」で3D反転、「[ 店舗詳細 → ]」で詳細ページへ遷移）
               // 生成店铺卡片 HTML（点击「店舗概要 →」触发3D翻转，点击「[ 店舗詳細 → ]」跳转详情页）
               grid.innerHTML = list.map(s => `
               <div class="col-12 col-md-4">
                    <div class="product-flip-card" style="height: 310px;">
                         <div class="product-flip-inner">
                              <!-- カード表面 / 卡片正面 -->
                              <div class="card product-flip-front">
                                   <div class="shop-img-box border-bottom d-flex align-items-center justify-content-center">
                                        <button type="button" class="btn btn-link text-danger position-absolute top-0 end-0 m-1 p-1" hidden aria-label="お気に入り"><i class="bi bi-heart fs-5"></i></button>
                                        <span class="text-secondary small"><i class="bi bi-shop me-1"></i>店舗写真</span>
                                        <span class="position-absolute bottom-0 start-0 m-2 px-2 py-1 bg-white bg-opacity-75 rounded small fw-bold">出品中：${s.count}件</span>
                                   </div>
                                   <div class="card-body p-3 d-flex flex-column justify-content-between">
                                        <div>
                                             <div class="mb-1"><span class="fw-bold">${s.name}</span> <span class="small text-secondary ms-1">${s.genre}</span></div>
                                             <div class="small text-secondary mb-1">${s.address}</div>
                                             <div class="small text-secondary"><i class="bi bi-clock me-1"></i>${s.hours}</div>
                                        </div>
                                        <div class="d-flex justify-content-between align-items-center border-top pt-2">
                                             <button type="button" class="flip-toggle-link js-flip-to-back">店舗概要 &rarr;</button>
                                             <a href="shop_detail.html" class="flip-toggle-link fw-bold">[ 店舗詳細 &rarr; ]</a>
                                        </div>
                                   </div>
                              </div>
                              <!-- カード裏面（店舗概要） / 卡片背面（店铺简介详情） -->
                              <div class="card product-flip-back">
                                   <div class="card-body p-4 d-flex flex-column justify-content-between">
                                        <div>
                                             <h4 class="h6 fw-bold border-bottom pb-2 mb-2">${s.name}</h4>
                                             <ul class="small ps-3 mb-0" style="line-height: 1.8;">
                                                  <li><strong>特徴：</strong>${s.desc}</li>
                                                  <li><strong>アクセス：</strong>${s.access}</li>
                                                  <li><strong>定休日：</strong>${s.holiday}</li>
                                                  <li><strong>出品中：</strong>${s.count}件</li>
                                             </ul>
                                        </div>
                                        <div class="d-flex justify-content-between align-items-center border-top pt-2">
                                             <button type="button" class="flip-toggle-link js-flip-to-front">&larr; 戻る</button>
                                             <a href="shop_detail.html" class="btn btn-brown btn-sm">出品商品を見る</a>
                                        </div>
                                   </div>
                              </div>
                         </div>
                    </div>
               </div>`).join('');
          }

          // 初期描画とイベント登録 / 页面加载首次渲染及绑定搜索事件
          renderShops();
          document.getElementById('shopSearchBtn').addEventListener('click', renderShops);
          document.getElementById('shopSearchInput').addEventListener('keydown', e => { if (e.key === 'Enter') renderShops(); });
       
     </script>

</body>
</html>
