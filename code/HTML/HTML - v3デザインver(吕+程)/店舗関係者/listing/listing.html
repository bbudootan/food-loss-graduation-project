               <img src="../../images/logo-small.png" alt="JEC" style="height: 40px; width: auto;">

               <div class="fs-6 fw-bold" style="color: #4a3525;">JEC Food Rescue</div>
               <div class="small text-secondary mt-1">店舗管理</div>
               </div>
               </a>

                    <!-- 主菜单 -->
                    <nav class="nav nav-pills flex-column">
                         <a class="nav-link link-body-emphasis" href="../main/main.html"><i class="bi bi-house me-2"></i>メイン</a>
                    </nav>

                    <!-- 販売分组（当前高亮：出品・在庫） -->
                    <p class="small fw-bold text-secondary mt-3 mb-1 ms-2">販売</p>
                    <nav class="nav nav-pills flex-column">

                    </nav>

                    <!-- 暂时隐藏「商品」和「店舗」分组（需要恢复时删掉前后的注释符号即可）
                    <p class="small fw-bold text-secondary mt-3 mb-1 ms-2">商品</p>
                    <nav class="nav nav-pills flex-column">
                         <a class="nav-link link-body-emphasis" href="../request/request.html"><i class="bi bi-plus-square me-2"></i>商品登録の依頼</a>

                    <nav class="nav nav-pills flex-column">

          <!-- 侧边栏到此结束 -->

          <!-- 右侧内容区 -->
          <div class="flex-grow-1 overflow-hidden">
               <!-- 顶部导航栏 -->
               <header class="d-flex align-items-center border-bottom bg-white px-3" style="min-height: 48px;">
                    <button class="btn btn-outline-secondary btn-sm d-lg-none me-2" type="button"
                         data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="メニュー">
                         <i class="bi bi-list"></i>
                    </button>
               </header>

               <!-- 页面主体内容区 -->
               <main class="container-fluid p-4">

                    <!-- 页面标题与顶部双操作按钮行 -->
                    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4 pb-2 border-bottom">
                         <div>
                              <h1 class="h3 fw-bold mb-1">出品・在庫</h1>
                              <p class="text-secondary mb-0">新規商品の出品登録、および現在出品中商品の編集・在庫数調整を行えます</p>
                         </div>
                         <div class="d-flex flex-wrap gap-2">
                              <!-- 1. 商品を出品（跳往バーコード読み取り / 商品選択页） -->
                              <div class="d-flex flex-wrap gap-2">
                          <a href="listing-select.html" class="btn btn-dark px-4 py-2">
                           <i class="bi bi-plus-lg me-1"></i> 商品を出品
                               </a>
                           <!-- 点击跳转到同文件夹下的商品マスター登録依頼页面 -->
                          <a href="listing-request.html" class="btn btn-outline-dark px-4 py-2">
                                商品マスター登録を依頼
                              </a>
                              </div>
                         </div>
                    </div>

                    <!-- 【1. 商品検索・状態筛选卡片】 -->
                    <div class="card shadow-sm mb-4">
                         <div class="card-body p-4">
                              <form class="row g-3 align-items-end">
                                   <!-- 商品検索（商品名・バーコード） -->
                                   <div class="col-12 col-md-6">
                                        <label for="searchKeyword" class="form-label fw-bold">商品検索</label>
                                        <input type="text" class="form-control" id="searchKeyword" placeholder="商品名・バーコード">
                                   </div>

                                   <!-- 状態下拉框 -->
                                   <div class="col-12 col-md-4">
                                        <label for="listingStatus" class="form-label fw-bold">状態</label>
                                        <select class="form-select" id="listingStatus">
                                             <option value="all" selected>すべて</option>
                                             <option value="active">出品中</option>
                                             <option value="stopped">出品停止中</option>
                                        </select>
                                   </div>

                                   <!-- 検索按钮 -->
                                   <div class="col-12 col-md-2">
                                        <button type="submit" class="btn btn-outline-dark w-100">
                                             <i class="bi bi-search me-1"></i>検索
                                        </button>
                                   </div>
                              </form>
                         </div>
                    </div>

                    <!-- 【2. 出品・在庫商品列表表格】 -->
                    <div class="card shadow-sm">
                         <div class="card-body p-0">
                              <div class="table-responsive">
                                   <table class="table table-hover align-middle mb-0 text-center">
                                        <thead class="table-light">
                                             <tr>
                                                  <th scope="col" style="width: 26%;">商品名</th>
                                                  <th scope="col" style="width: 14%;">販売価格</th>
                                                  <th scope="col" style="width: 12%;">在庫数</th>
                                                  <th scope="col" style="width: 18%;">食品期限</th>
                                                  <th scope="col" style="width: 12%;">状態</th>
                                                  <th scope="col" style="width: 18%;">操作</th>
                                             </tr>
                                        </thead>
                                        <tbody>
                                             <!-- 示例行 1：出品中 -->
                                             <tr>
                                                  <td class="text-start fw-bold">北海道産バターのクロワッサン</td>
                                                  <td>¥180</td>
                                                  <td>12個</td>
                                                  <td>2026/11/16 20:00</td>
                                                  <td>
                                                       <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">出品中</span>
                                                  </td>
                                                  <td>
                                                       <div class="d-flex justify-content-center gap-2">
                                                            <a href="listing-edit.html" class="btn btn-outline-dark btn-sm px-3">編集</a>
                                                            <a href="listing-stock.html" class="btn btn-outline-secondary btn-sm px-3">在庫調整</a>
                                                       </div>
                                                  </td>
                                             </tr>

                                            <!-- 示例行 2：出品停止中 -->
                                             <tr>
                                                  <td class="text-start fw-bold ps-3">彩り幕の内弁当</td>
                                                  <td>¥480</td>
                                                  <td>0個</td>
                                                  <td>2026/11/16 19:00</td>
                                                  <td>
                                                       <span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle px-3 py-2 text-nowrap">出品停止中</span>
                                                  </td>
                                                  <td>
                                                       <div class="d-flex justify-content-center gap-2">
                                                            <a href="listing-edit.html" class="btn btn-outline-dark btn-sm px-3 text-nowrap">編集</a>
                                                            <a href="listing-stock.html" class="btn btn-outline-secondary btn-sm px-3 text-nowrap">在庫調整</a>
                                                       </div>
                                                  </td>
                                             </tr>
                                        </tbody>
                                   </table>
                              </div>
                         </div>
                    </div>

               </main>
          </div>
