<!DOCTYPE html>
<html lang="ja">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>新規出店申請 - JEC Food Rescue</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <link rel="stylesheet" href="../css/style.css">
</head>

<body class="top-hero-bg d-flex flex-column min-vh-100">

     <!-- 顶部半透明导航栏 -->
     <header class="bg-white bg-opacity-75 border-bottom py-2 px-4 d-flex align-items-center justify-content-between"
             style="backdrop-filter: blur(6px);">
          <a href="login.html" class="d-flex align-items-center text-decoration-none">
               <img src="../../images/logo.png" alt="JEC Food Rescue" style="height: 44px;">
          </a>
          <span class="small fw-bold text-secondary">新規出店お申し込み</span>
     </header>

     <!-- 主体表单区 -->
     <main class="container py-5 flex-grow-1">
          <div class="row justify-content-center">
               <div class="col-12 col-lg-8">

                    <div class="hero-glass-card p-4 p-md-5">

                         <h1 class="h3 fw-bold mb-4 pb-2 border-bottom" style="color: #4a3525;">新規出店申請</h1>

                         <form action="apply-confirm.html" method="get">

                              <!-- 【1. 店舗情報】 -->
                              <div class="bg-white rounded-4 border p-4 mb-4">
                                   <h2 class="h5 fw-bold mb-4 pb-2 border-bottom" style="color: #4a3525;">店舗情報</h2>

                                   <div class="mb-3">
                                        <label for="shopName" class="form-label fw-bold">店舗名</label>
                                        <input type="text" class="form-control" id="shopName" name="shop_name" placeholder="例：ベーカリー太陽 新宿店">
                                   </div>

                                   <div class="mb-3">
                                        <label for="shopAddress" class="form-label fw-bold">店舗住所</label>
                                        <input type="text" class="form-control" id="shopAddress" name="shop_address" placeholder="例：東京都新宿区西新宿1-1-1">
                                   </div>

                                   <div class="mb-3">
                                        <label for="shopTel" class="form-label fw-bold">電話番号</label>
                                        <input type="tel" class="form-control" id="shopTel" name="shop_tel" placeholder="例：03-1234-5678">
                                   </div>

                                   <div class="mb-3">
                                        <label for="staffName" class="form-label fw-bold">担当者名</label>
                                        <input type="text" class="form-control" id="staffName" name="staff_name" placeholder="例：山田 太郎">
                                   </div>

                                   <div class="mb-3">
                                        <label class="form-label fw-bold">開店時間 〜 閉店時間</label>
                                        <div class="row g-2 align-items-center">
                                             <div class="col-5 col-sm-4">
                                                  <input type="time" class="form-control" id="openTime" name="open_time" value="09:00">
                                             </div>
                                             <div class="col-2 col-sm-1 text-center fw-bold">〜</div>
                                             <div class="col-5 col-sm-4">
                                                  <input type="time" class="form-control" id="closeTime" name="close_time" value="20:00">
                                             </div>
                                        </div>
                                        <div class="form-text">※開店時間・閉店時間を入力してください（翌日にまたがる営業時間も登録可能です）</div>
                                   </div>

                                   <div class="mb-2">
                                        <label for="shopIntro" class="form-label fw-bold">店舗紹介</label>
                                        <textarea class="form-control" id="shopIntro" name="shop_intro" rows="4"
                                                  placeholder="お店のこだわりや取り扱う商品の特徴などを入力してください"></textarea>
                                   </div>
                              </div>

                              <!-- 【2. 承認後のログインに使う情報】 -->
                              <div class="bg-white rounded-4 border p-4 mb-4">
                                   <h2 class="h5 fw-bold mb-4 pb-2 border-bottom" style="color: #4a3525;">承認後のログインに使う情報</h2>

                                   <div class="mb-3">
                                        <label for="applyEmail" class="form-label fw-bold">メールアドレス</label>
                                        <input type="email" class="form-control" id="applyEmail" name="apply_email" placeholder="example@shop.jp">
                                   </div>

                                   <div class="mb-3">
                                        <label for="applyPassword" class="form-label fw-bold">パスワード</label>
                                        <input type="password" class="form-control" id="applyPassword" name="apply_password" placeholder="8文字以上の英数字">
                                   </div>

                                   <div class="mb-2">
                                        <label for="applyPasswordConfirm" class="form-label fw-bold">パスワード（確認）</label>
                                        <input type="password" class="form-control" id="applyPasswordConfirm" name="apply_password_confirm" placeholder="確認のためもう一度入力してください">
                                   </div>
                              </div>

                              <!-- 底部操作按钮 -->
                              <div class="d-flex flex-wrap gap-3">
                                   <button type="submit" class="btn btn-rescue-primary px-5 py-2 fw-bold rounded-3">確認画面へ進む</button>
                                   <a href="login.html" class="btn btn-outline-secondary px-4 py-2 rounded-3">戻る</a>
                              </div>

                         </form>

                    </div>

               </div>
          </div>
     </main>

     <footer class="text-center pb-4">
          <small class="text-secondary">v1.0 &nbsp; © 2026 JEC Food Rescue</small>
     </footer>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
