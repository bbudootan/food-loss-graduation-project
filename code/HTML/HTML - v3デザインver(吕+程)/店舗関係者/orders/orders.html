                    <div class="fs-6 fw-bold" style="color: #4a3525;">JEC Food Rescue</div>

                </div>
               </a>

                    <!-- 主菜单 -->
                    <nav class="nav nav-pills flex-column">

                    <!-- 販売分组（当前高亮：注文管理） -->
                    <p class="small fw-bold text-secondary mt-3 mb-1 ms-2">販売</p>
                    <nav class="nav nav-pills flex-column">

                    <!-- 暂时隐藏「商品」和「店舗」分组

               </div>
          </div>

          <!-- 右侧内容区 -->
          <div class="flex-grow-1 overflow-hidden">
               <header class="d-flex align-items-center border-bottom bg-white px-3" style="min-height: 48px;">
                    <button class="btn btn-outline-secondary btn-sm d-lg-none me-2" type="button"
                         data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="メニュー">
                         <i class="bi bi-list"></i>
                    </button>
               </header>

               <main class="container-fluid p-4">

                    <!-- 页面标题行 -->
                    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4 pb-2 border-bottom">
                         <div>
                              <h1 class="h3 fw-bold mb-1">注文管理</h1>
                              <p class="text-secondary mb-0">注文番号や状態での絞り込み、および各注文の詳細確認を行えます</p>
                         </div>
                    </div>

                    <!-- 【1. 筛选条件卡片】 -->
                    <div class="card shadow-sm mb-4">
                         <div class="card-body p-4">
                              <form class="row g-3 align-items-end">
                                   <div class="col-12 col-md-5">
                                        <label for="orderNumber" class="form-label fw-bold">注文番号</label>
                                        <input type="text" class="form-control" id="orderNumber" placeholder="例：ORD-20261112-001">
                                   </div>

                                   <div class="col-12 col-md-5">
                                        <label for="orderStatus" class="form-label fw-bold">状態</label>
                                        <select class="form-select" id="orderStatus">
                                             <option value="all" selected>すべて</option>
                                             <option value="waiting">受け取り待ち</option>
                                             <option value="completed">受け取り済み</option>
                                             <option value="cancelled">キャンセル済み</option>
                                        </select>
                                   </div>

                                   <div class="col-12 col-md-2">
                                        <button type="submit" class="btn btn-dark w-100">絞り込む</button>
                                   </div>
                              </form>
                         </div>
                    </div>

                    <!-- 【2. 订单列表表格】 -->
                    <div class="card shadow-sm">
                         <div class="card-body p-0">
                              <div class="table-responsive">
                                   <table class="table table-hover align-middle mb-0 text-center">
                                        <thead class="table-light">
                                             <tr>
                                                  <th scope="col" style="width: 22%;">注文番号</th>
                                                  <th scope="col" style="width: 22%;">受け取り時間</th>
                                                  <th scope="col" style="width: 26%;">内容</th>
                                                  <th scope="col" style="width: 15%;">状態</th>
                                                  <th scope="col" style="width: 15%;">操作</th>
                                             </tr>
                                        </thead>
                                        <tbody>
                                             <!-- 示例行 1 -->
                                             <tr>
                                                  <td class="fw-bold">ORD-20261112-001</td>
                                                  <td>17:00 〜 18:00</td>
                                                  <td class="text-start">日替わり特製弁当 × 1</td>
                                                  <td>
                                                       <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle px-3 py-2">受け取り待ち</span>
                                                  </td>
                                                  <td>
                                                       <a href="order-detail.html" class="btn btn-outline-dark btn-sm px-4">詳細</a>
                                                  </td>
                                             </tr>

                                             <!-- 示例行 2 -->
                                             <tr>
                                                  <td class="fw-bold">ORD-20261112-002</td>
                                                  <td>15:00 〜 16:00</td>
                                                  <td class="text-start">焼き立てパン詰め合わせセット × 2</td>
                                                  <td>
                                                       <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">受け取り済み</span>
                                                  </td>
                                                  <td>
                                                       <a href="order-detail.html" class="btn btn-outline-dark btn-sm px-4">詳細</a>
                                                  </td>
                                             </tr>
                                        </tbody>
                                   </table>
                              </div>
                         </div>
                    </div>

               </main>
          </div>
     </div>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
