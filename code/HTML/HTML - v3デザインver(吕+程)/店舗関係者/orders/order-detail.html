<!DOCTYPE html>
<html lang="ja">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>注文詳細 - JEC Food Rescue</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

     <div class="d-flex min-vh-100">

          <!-- 侧边栏 -->
          <div class="offcanvas-lg offcanvas-start bg-white border-end flex-shrink-0" id="sidebar">
               <div class="offcanvas-header d-lg-none">
                    <h5 class="offcanvas-title">メニュー</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="閉じる"></button>
               </div>

               <div class="offcanvas-body d-flex flex-column p-3">
                    <!-- 小 Logo + 换行后的「店舗管理」 -->
                    <a href="../main/main.html" class="d-flex align-items-center gap-2 mb-3 text-decoration-none link-body-emphasis">
                         <img src="../../images/logo-small.png" alt="JEC" style="height: 40px; width: auto;">
                         <div class="lh-sm">
                              <div class="fs-6 fw-bold" style="color: #4a3525;">JEC Food Rescue</div>
                              <div class="small text-secondary mt-1">店舗管理</div>
                         </div>
                    </a>

                    <nav class="nav nav-pills flex-column">
                         <a class="nav-link link-body-emphasis" href="../main/main.html"><i class="bi bi-house me-2"></i>メイン</a>
                    </nav>

                    <p class="small fw-bold text-secondary mt-3 mb-1 ms-2">販売</p>
                    <nav class="nav nav-pills flex-column">
                         <a class="nav-link link-body-emphasis" href="../pickup/pickup.html"><i class="bi bi-pencil-square me-2"></i>受け取り</a>
                         <a class="nav-link active" href="../orders/orders.html"><i class="bi bi-receipt me-2"></i>注文管理</a>
                         <a class="nav-link link-body-emphasis" href="../listing/listing.html"><i class="bi bi-box-seam me-2"></i>出品・在庫</a>
                    </nav>

                    <hr>
                    <a class="nav-link link-body-emphasis" href="../login/login.html"><i class="bi bi-box-arrow-left me-2"></i>ログアウト</a>
               </div>
          </div>

          <!-- 右侧内容区 -->
          <div class="flex-grow-1 overflow-hidden">
               <header class="d-flex align-items-center border-bottom bg-white px-3" style="min-height: 48px;">
                    <button class="btn btn-outline-secondary btn-sm d-lg-none me-2" type="button"
                         data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="メニュー">
                         <i class="bi bi-list"></i>
                    </button>
               </header>

               <main class="container-fluid p-4">

                    <!-- 页面标题行 -->
                    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4 pb-2 border-bottom">
                         <div>
                              <h1 class="h3 fw-bold mb-1">注文詳細</h1>
                              <p class="text-secondary mb-0">注文内容の詳細確認、受け取り処理、または店舗都合キャンセルを行えます</p>
                         </div>
                    </div>

                    <!-- 【注文内容详情卡片】 -->
                    <div class="card shadow-sm">
                         <div class="card-body p-4">

                              <!-- 内部信息边框盒 -->
                              <div class="border rounded p-4 mb-4 bg-white">
                                   <h2 class="h5 fw-bold mb-4 pb-2 border-bottom">注文内容</h2>

                                   <div class="mb-3 pb-2 border-bottom">
                                        <div class="small text-secondary fw-bold mb-1">注文番号</div>
                                        <div class="fw-bold">ORD-20261112-001</div>
                                   </div>

                                   <div class="mb-3 pb-2 border-bottom">
                                        <div class="small text-secondary fw-bold mb-1">注文状態</div>
                                        <div>
                                             <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle px-3 py-1">受け取り待ち</span>
                                        </div>
                                   </div>

                                   <div class="mb-3 pb-2 border-bottom">
                                        <div class="small text-secondary fw-bold mb-1">店舗</div>
                                        <div>ベーカリー太陽 新宿店</div>
                                   </div>

                                   <div class="mb-3 pb-2 border-bottom">
                                        <div class="small text-secondary fw-bold mb-1">受け取り日時</div>
                                        <div>2026年11月12日 17:00 〜 18:00</div>
                                   </div>

                                   <div class="mb-3 pb-2 border-bottom">
                                        <div class="small text-secondary fw-bold mb-1">商品</div>
                                        <div>日替わり特製弁当 × 1</div>
                                   </div>

                                   <div>
                                        <div class="small text-secondary fw-bold mb-1">支払額</div>
                                        <div class="fs-5 fw-bold">¥500（税込）</div>
                                   </div>
                              </div>

                              <!-- 【底部操作按钮组】 -->
                              <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center">
                                   <div class="d-flex flex-wrap gap-2">
                                        <!-- 点击直接唤起下方 id="cancelConfirmModal" 的确认取消弹窗 -->
                                        <button type="button" class="btn btn-outline-danger px-4 py-2"
                                                data-bs-toggle="modal" data-bs-target="#cancelConfirmModal">
                                             店舗都合キャンセル
                                        </button>
                                   </div>

                                   <!-- 一覧へ（同文件夹内返回） -->
                                   <div>
                                        <a href="orders.html" class="btn btn-outline-secondary px-4 py-2">一覧へ</a>
                                   </div>
                              </div>

                         </div>
                    </div>

               </main>
          </div>
     </div>

     <!-- 弹窗放在最外层（不受父级毛玻璃层级限制），点击「店舗都合キャンセル」后居中弹出 -->
     <div class="modal fade" id="cancelConfirmModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered">
               <div class="modal-content">
                    <div class="modal-header">
                         <h5 class="modal-title fw-bold text-danger">キャンセル確定確認</h5>
                         <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
                    </div>
                    <div class="modal-body p-4">
                         <p class="mb-2">注文番号：<strong>ORD-20261112-001</strong></p>
                         <p class="mb-0">この注文を店舗都合により<strong>キャンセル確定</strong>してもよろしいですか？</p>
                    </div>
                    <div class="modal-footer">
                         <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">戻る</button>
                         <a href="orders.html" class="btn btn-danger">確定して一覧へ戻る</a>
                    </div>
               </div>
          </div>
     </div>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
