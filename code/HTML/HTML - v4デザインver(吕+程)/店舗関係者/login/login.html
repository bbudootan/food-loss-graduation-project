<!DOCTYPE html>
<html lang="ja">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>店舗運営者の方へ - JEC Food Rescue</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <link rel="stylesheet" href="../css/style.css">
</head>

<body class="top-hero-bg d-flex flex-column min-vh-100">

     <main class="container my-auto py-5">
          <div class="row justify-content-center">
               <div class="col-12 col-lg-9 col-xl-8">

                    <!-- 半透明柔光主卡片 -->
                    <div class="hero-glass-card text-center px-4 py-5 p-md-5">

                         <!-- 1. 顶部 Logo 与标题区（去掉下方 JEC Food Rescue 文字，直接用 Logo 图） -->
                         <div class="mb-4">
                              <img src="../../images/logo.png" alt="JEC Food Rescue おいしさを、もう一度。" class="img-fluid mb-3"
                                   style="max-height: 165px;">
                              <h1 class="h3 fw-bold mb-2" style="color: #4a3525;">店舗運営者の方へ</h1>
                              <p class="text-secondary mb-0">ご利用方法をお選びください。</p>
                         </div>

                         <!-- 2. 双卡片选择区（はじめての方 / アカウントをお持ちの方） -->
                         <div class="row g-4 justify-content-center my-3">

                              <!-- 左侧卡片：はじめての方 -->
                              <div class="col-12 col-md-6">
                                   <div class="choice-sub-card h-100 p-4 p-md-5 d-flex flex-column justify-content-between">
                                        <div>
                                             <h2 class="h5 fw-bold mb-3" style="color: #4a3525;">はじめての方</h2>
                                             <p class="small text-secondary mb-4">新規出店のお申し込みはこちら</p>
                                        </div>
                                        <div>
                                             <a href="apply.html" class="btn btn-rescue-outline w-100 py-2 fw-bold rounded-3">
                                                  新規出店へ進む →
                                             </a>
                                        </div>
                                   </div>
                              </div>

                              <!-- 右侧卡片：アカウントをお持ちの方 -->
                              <div class="col-12 col-md-6">
                                   <div class="choice-sub-card h-100 p-4 p-md-5 d-flex flex-column justify-content-between">
                                        <div>
                                             <h2 class="h5 fw-bold mb-3" style="color: #4a3525;">アカウントをお持ちの方</h2>
                                             <p class="small text-secondary mb-4">店舗管理画面へログインします</p>
                                        </div>
                                        <div>
                                             <a href="signin.html" class="btn btn-rescue-primary w-100 py-2 fw-bold rounded-3">
                                                  ログイン →
                                             </a>
                                        </div>
                                   </div>
                              </div>

                         </div>

                         <!-- 3. 底部返回外层门户首页链接 -->
                         <div class="mt-4 pt-2">
                              <a href="../../index.html" class="text-decoration-none small fw-bold role-link">
                                   ← 最初の画面に戻る
                              </a>
                         </div>

                    </div>

               </div>
          </div>
     </main>

     <footer class="text-center pb-4">
          <small class="text-secondary">v1.0 &nbsp; © 2026 JEC Food Rescue</small>
     </footer>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
