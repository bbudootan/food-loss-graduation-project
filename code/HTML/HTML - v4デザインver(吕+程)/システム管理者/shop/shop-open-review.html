<!DOCTYPE html>
<html lang="ja">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- 【页面标题】修改为当前页面的名称 -->
     <title>出店申請の審査 - JEC Food Rescue</title>
     <!-- 加载 Bootstrap 5 核心样式库 -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <!-- 加载 Bootstrap 图标库 -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <!-- 加载自定义的 CSS 样式 -->
     <link rel="stylesheet" href="../css/style.css">
</head>

<!-- 将整个页面的背景设置为浅灰色 -->

<body class="bg-light">

     <!-- 将“侧边栏”与“右侧内容区”横向并排 -->
     <div class="d-flex min-vh-100">

          <!-- 侧边栏（完全保持最新基底 admin_template.html 结构一致） -->
          <div class="offcanvas-lg offcanvas-start bg-white border-end flex-shrink-0" id="sidebar">
               <div class="offcanvas-header d-lg-none">
                    <h5 class="offcanvas-title">メニュー</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="閉じる"></button>
               </div>

               <div class="offcanvas-body d-flex flex-column p-3">
                    <!-- 标题 Logo -->
                    <a href="../main/main.html" class="d-block mb-2 text-decoration-none link-body-emphasis">
                         <div class="fw-bold">JEC Food Rescue</div>
                         <small class="text-secondary">システム管理</small>
                    </a>

                    <!-- 【1. メイン】 -->
                    <nav class="nav nav-pills flex-column">
                         <a class="nav-link link-body-emphasis" href="../main/main.html"><i class="bi bi-house me-2"></i>メイン</a>
                    </nav>

                    <!-- 【2. 第一组：審査】（保持店舗管理高亮） -->
                    <p class="small fw-bold text-secondary mt-3 mb-1 ms-2">審査</p>
                    <nav class="nav nav-pills flex-column">
                         <a class="nav-link active" href="shop.html"><i class="bi bi-shop me-2"></i>店舗管理</a>
                         <a class="nav-link link-body-emphasis" href="../product-request/product-request.html"><i class="bi bi-plus-square me-2"></i>商品登録依頼</a>
                    </nav>

                    <!-- 【3. 第二组：管理】 -->
                    <p class="small fw-bold text-secondary mt-3 mb-1 ms-2">管理</p>
                    <nav class="nav nav-pills flex-column">
                       <!--  <a class="nav-link link-body-emphasis" href="../account/account.html"><i class="bi bi-people me-2"></i>アカウント管理</a>-->
                         <a class="nav-link link-body-emphasis" href="../product/product.html"><i class="bi bi-tag me-2"></i>商品マスター</a>
                       <!--  <a class="nav-link link-body-emphasis" href="../review/review.html"><i class="bi bi-flag me-2"></i>レビュー管理</a>
                         <a class="nav-link link-body-emphasis" href="../faq/faq.html"><i class="bi bi-question-circle me-2"></i>FAQ管理</a>-->
                    </nav>

                    <!-- 【4. 第三组：サポート】 -->
                    <!--<p class="small fw-bold text-secondary mt-3 mb-1 ms-2">サポート</p>
                    <nav class="nav nav-pills flex-column">
                         <a class="nav-link link-body-emphasis" href="../contact/contact.html"><i class="bi bi-chat-left-text me-2"></i>お問い合わせ</a>
                    </nav> -->

                    <hr>
                    <a class="nav-link link-body-emphasis" href="../login/login.html"><i class="bi bi-box-arrow-left me-2"></i>ログアウト</a>
               </div>
          </div>
          <!-- 侧边栏到此结束 -->

          <!-- 右侧内容区 -->
          <div class="flex-grow-1 overflow-hidden">
               <!-- 顶部导航栏 -->
               <header class="d-flex align-items-center border-bottom bg-white px-3" style="min-height: 48px;">
                    <button class="btn btn-outline-secondary btn-sm d-lg-none me-2" type="button"
                         data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="メニュー">
                         <i class="bi bi-list"></i>
                    </button>
               </header>

               <!-- 画面主要内容展示区 -->
               <main class="container-fluid p-4">

                    <!-- 页面标题行 -->
                    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
                         <div>
                              <h1 class="h3 fw-bold mb-1">出店申請の審査</h1>
                              <p class="text-secondary mb-0">申請された店舗情報を確認し、承認または非承認を選択してください</p>
                         </div>
                    </div>

                    <!-- 【申请详情展示卡片】 -->
                    <div class="card shadow-sm">
                         <div class="card-body p-4">
                              
                              <!-- 内部信息边框盒（对应原型图中的内框：店舗名、住所、営業時間） -->
                              <div class="border rounded p-4 mb-4 bg-white">
                                   <!-- 1. 店舗名 -->
                                   <div class="mb-3 pb-2 border-bottom">
                                        <div class="small text-secondary fw-bold mb-1">店舗名</div>
                                        <div class="fs-5 fw-bold">ベーカリー太陽 新宿店</div>
                                   </div>

                                   <!-- 2. 住所 -->
                                   <div class="mb-3 pb-2 border-bottom">
                                        <div class="small text-secondary fw-bold mb-1">住所</div>
                                        <div>東京都新宿区西新宿1-7-3</div>
                                   </div>

                                   <!-- 3. 営業時間 -->
                                   <div>
                                        <div class="small text-secondary fw-bold mb-1">営業時間</div>
                                        <div>09:00 〜 20:00（定休日：水曜日）</div>
                                   </div>
                              </div>

                              <!-- 【底部操作按钮组：承認する / 非承認 / 店舗管理画面へ】 -->
                              <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center">
                                   <div class="d-flex gap-2">
                                        <!-- 1. 承認する（触发确认弹窗） -->
                                        <button type="button" class="btn btn-dark px-4 py-2" data-bs-toggle="modal" data-bs-target="#approveModal">
                                             承認する
                                        </button>
                                        <!-- 2. 非承認（触发拒绝弹窗） -->
                                        <button type="button" class="btn btn-outline-danger px-4 py-2" data-bs-toggle="modal" data-bs-target="#rejectModal">
                                             非承認
                                        </button>
                                   </div>

                                   <!-- 3. 店舗管理画面へ（返回出店申请列表页） -->
                                   <div>
                                        <a href="shop.html" class="btn btn-outline-secondary px-4 py-2">店舗管理画面へ</a>
                                   </div>
                              </div>

                         </div>
                    </div>

               </main>
          </div>
          <!-- 右侧内容区到此结束 -->
     </div>

     <!-- 弹窗 1：承認する 确认弹窗 -->
     <div class="modal fade" id="approveModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered">
               <div class="modal-content">
                    <div class="modal-header">
                         <h5 class="modal-title fw-bold">承認確認</h5>
                         <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                         この店舗の出店申請を<strong>承認</strong>してもよろしいですか？
                    </div>
                    <div class="modal-footer">
                         <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                         <a href="shop.html" class="btn btn-dark">承認を確定する</a>
                    </div>
               </div>
          </div>
     </div>

     <!-- 弹窗 2：非承認 确认弹窗 -->
     <div class="modal fade" id="rejectModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered">
               <div class="modal-content">
                    <div class="modal-header">
                         <h5 class="modal-title fw-bold text-danger">非承認確認</h5>
                         <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                         この店舗の出店申請を<strong>非承認</strong>にしてもよろしいですか？
                    </div>
                    <div class="modal-footer">
                         <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                         <a href="shop.html" class="btn btn-danger">非承認を確定する</a>
                    </div>
               </div>
          </div>
     </div>

     <!-- 加载 Bootstrap 官方 JS 交互逻辑库 -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
