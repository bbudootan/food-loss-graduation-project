<!DOCTYPE html>
<html lang="ja">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>新規登録 - JEC Food Rescue</title>
     <!-- Bootstrap 5 CSS -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <!-- 自定义基础样式（引用 ユーザー/css/style.css） -->
     <link rel="stylesheet" href="../css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

     <!-- 1. 顶部简单导航栏（对应线框图：JEC Food Rescue / [ホームへ戻る]） -->
     <header class="navbar bg-white border-bottom py-2">
          <div class="container">
               <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="../index.html">
                    <img src="../../images/logo-small.png" alt="JEC" style="height: 32px;">
                    <span>JEC Food Rescue</span>
               </a>
               <a href="../index.html" class="btn btn-outline-secondary btn-sm">
                    ホームへ戻る
               </a>
          </div>
     </header>

     <!-- 2. 主内容区：新規登録表单 -->
     <main class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
          <div class="card w-100" style="max-width: 520px;">
               <div class="card-body p-4 p-md-5">
                    <h1 class="h4 fw-bold text-center mb-4">新規登録</h1>

                    <form id="registerForm">
                         <!-- ニックネーム -->
                         <div class="mb-3">
                              <label for="nickname" class="form-label fw-bold small">ニックネーム</label>
                              <input type="text" class="form-control" id="nickname" placeholder="例：たろう" required>
                              <div class="form-text small text-secondary">
                                   レビューなどで公開される名前です。
                              </div>
                         </div>

                         <!-- メールアドレス -->
                         <div class="mb-3">
                              <label for="regEmail" class="form-label fw-bold small">メールアドレス</label>
                              <input type="email" class="form-control" id="regEmail" placeholder="example@jec.ac.jp" required>
                         </div>

                         <!-- パスワード（带 [表示] 切换按钮） -->
                         <div class="mb-3">
                              <label for="regPassword" class="form-label fw-bold small">パスワード</label>
                              <div class="input-group">
                                   <input type="password" class="form-control" id="regPassword" minlength="12" placeholder="12文字以上で入力" required>
                                   <button class="btn btn-outline-secondary" type="button" id="togglePwdBtn">表示</button>
                              </div>
                         </div>

                         <!-- パスワード（確認） -->
                         <div class="mb-3">
                              <label for="regPasswordConfirm" class="form-label fw-bold small">パスワード（確認）</label>
                              <input type="password" class="form-control" id="regPasswordConfirm" minlength="12" placeholder="もう一度入力してください" required>
                              <div class="form-text small text-secondary">
                                   12文字以上
                              </div>
                         </div>

                         <!-- 利用規約・プライバシーポリシー同意 -->
                         <div class="form-check mb-4">
                              <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                              <label class="form-check-label small" for="agreeTerms">
                                   <a href="#" class="text-decoration-underline text-dark">利用規約</a>・<a href="#" class="text-decoration-underline text-dark">プライバシーポリシー</a>に同意する
                              </label>
                         </div>

                         <!-- 登録確認メールを送る按钮 -->
                         <div class="d-grid mb-4">
                              <button type="submit" class="btn btn-brown py-2 fw-bold">
                                   登録確認メールを送る
                              </button>
                         </div>

                         <!-- 底部引导：すでに登録済みの方 [ログイン] -->
                         <div class="text-center border-top pt-3 small">
                              <span class="text-secondary me-2">すでに登録済みの方</span>
                              <a href="login.html" class="btn btn-outline-brown btn-sm">ログイン</a>
                         </div>
                    </form>
               </div>
          </div>
     </main>

     <!-- 3. 底部页脚 -->
     <footer class="bg-white border-top py-3 mt-4">
          <div class="container text-center small text-secondary">
               <a href="#" class="text-decoration-none text-secondary me-2">利用規約</a> /
               <a href="#" class="text-decoration-none text-secondary mx-2">プライバシーポリシー</a> /
               <a href="#" class="text-decoration-none text-secondary ms-2">運営について</a>
               <div class="mt-1">© 2026 JEC Food Rescue</div>
          </div>
     </footer>

     <!-- Bootstrap 5 JS -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
     <script>
          // 1. 密码 [表示 / 非表示] 切换功能
          const togglePwdBtn = document.getElementById('togglePwdBtn');
          const regPassword = document.getElementById('regPassword');
          togglePwdBtn.addEventListener('click', function() {
               if (regPassword.type === 'password') {
                    regPassword.type = 'text';
                    togglePwdBtn.textContent = '非表示';
               } else {
                    regPassword.type = 'password';
                    togglePwdBtn.textContent = '表示';
               }
          });

          // 2. 两次密码一致性校验 + 提交演示
          document.getElementById('registerForm').addEventListener('submit', function(e) {
               e.preventDefault();
               const pwd1 = document.getElementById('regPassword').value;
               const pwd2 = document.getElementById('regPasswordConfirm').value;

               if (pwd1 !== pwd2) {
                    alert('パスワードとパスワード（確認）が一致しません。');
                    return;
               }
               alert('確認メールを送信しました。（デモ：ログイン画面へ移動します）');
               location.href = 'login.html';
          });
     </script>

</body>
</html>
