<!DOCTYPE html>
<html lang="ja">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>注文・お支払い - JEC Food Rescue</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
     <div id="commonHeader"></div>

     <main class="container py-4 flex-grow-1" style="max-width: 800px;">
          <div class="card border-dark">
               <div class="card-header bg-white border-dark fw-bold">注文・お支払い</div>
               <div class="row g-0">
                    <!-- 左：店舗・時間・商品 / 左侧：店铺・时间・商品 -->
                    <div class="col-12 col-md-7 p-4  border-md-end border-dark">
                         <div class="fw-bold">こもれびベーカリー</div>
                         <div class="small text-secondary mb-3">東京都新宿区百人町1-10-5 / 受取期限：本日 20:00 まで</div>

                         <div class="mb-3">
                              <label class="fw-bold small me-2">受取予定時間：</label>
                              <select id="pickupTime" class="form-select form-select-sm d-inline-block w-auto border-dark">
                                   <option>18:00</option><option>18:15</option><option selected>18:30</option><option>18:45</option><option>19:00</option>
                                   <option>19:15</option><option>19:30</option><option>19:45</option><option>20:00</option>
                              </select>
                         </div>

                         <div class="small mb-3">
                              <div class="fw-bold mb-1">商品：</div>
                              <div class="d-flex justify-content-between ps-3"><span>パンお楽しみ袋 × 2</span><span>¥900</span></div>
                              <div class="d-flex justify-content-between ps-3 mb-2"><span>焼き菓子 × 1</span><span>¥300</span></div>
                              <div class="text-end"><a href="cart.html" class="text-dark fw-bold text-decoration-none">[ カートで変更 ]</a></div>
                         </div>

                         <!--<div class="border-top pt-2 small text-secondary">
                              <strong class="text-dark">支払い方法</strong><br>※デモ決済：実際の請求は発生しません。
                         </div>　-->
                    </div>

                    <!-- 右：金額・確定ボタン / 右侧：金额与确认按钮 -->
                    <div class="col-12 col-md-5 p-4 bg-light d-flex flex-column justify-content-between">
                         <div>
                              <div class="fw-bold mb-2">お支払い金額</div>
                              <div class="d-flex justify-content-between small"><span>商品小計</span><span>¥1,200</span></div>
                              <div class="d-flex justify-content-between fw-bold border-top border-dark pt-2 mt-2"><span>合計（税込）</span><span class="fs-5">¥1,200</span></div>
                              <div class="small text-secondary">送料なし・店頭受取</div>
                         </div>
                         <button type="button" class="btn btn-brown fw-bold w-100 mt-4" onclick="sessionStorage.setItem('lastPickupTime', document.getElementById('pickupTime').value); location.href='order_complete.html';">[ ¥1,200で 注文を確定 ]</button>
                    </div>
               </div>
               <!--<div class="card-footer bg-white border-dark small">
                    <a href="javascript:alert('注文確定後のキャンセル・返金はお受けできません。')" class="text-dark fw-bold text-decoration-none me-3">[ キャンセル・返金条件 ]</a>
                    <a href="javascript:alert('受取期限内に必ず店頭にてお受け取りください。')" class="text-dark fw-bold text-decoration-none">[ 利用規約 ]</a>
               </div>-->
          </div>
     </main>

     <div id="commonFooter"></div>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
     <script>sessionStorage.setItem('isLoggedIn', 'true');</script>
     <script src="js/auth-state.js"></script>
</body>
</html>
