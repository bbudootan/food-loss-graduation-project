<!DOCTYPE html>
<html lang="ja">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>ホーム（ログイン済） - JEC Food Rescue</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

     <!-- 1. 共通ヘッダー / 公共顶栏 -->
     <div id="commonHeader"></div>

     <!-- 2. メインコンテンツ / 主内容区 -->
     <main class="container py-4 flex-grow-1">
          <!-- 共通ヒーローバナー / 公共轮播横幅 -->
          <div id="commonHero"></div>

          <!-- おすすめ商品 / 今日推荐商品 -->
          <section class="mb-5">
               <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h5 fw-bold mb-0">おすすめ商品</h2>
                    <a href="products.html" class="text-decoration-none text-dark fw-bold small">[ 商品一覧を見る &rarr; ]</a>
               </div>
               <div class="row g-3" id="homeProductGrid"></div>
          </section>

          <!-- 近所の人気店 / 附近人气店铺 -->
          <section class="mb-4">
               <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h5 fw-bold mb-0">近所の人気店</h2>
                    <a href="shops.html" class="text-decoration-none text-dark fw-bold small">[ 店舗一覧を見る &rarr; ]</a>
               </div>
               <div class="row g-3 mb-3" id="homeShopGrid"></div>
               <div class="text-center">
                    <button type="button" class="btn btn-link text-decoration-none text-dark fw-bold" id="toggleMoreBtn">[ もっと見る &#9660; ]</button>
               </div>
          </section>
     </main>

     <!-- 3. 共通フッター・ドロワー / 公共页脚与抽屉 -->
     <div id="commonFooter"></div>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
     <script>sessionStorage.setItem('isLoggedIn', 'true');</script>
     <script src="js/auth-state.js"></script>
     <script>
          renderProductCards('homeProductGrid');
          renderSimpleShopCards('homeShopGrid');
     </script>

</body>
</html>
