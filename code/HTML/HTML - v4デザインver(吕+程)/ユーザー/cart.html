<!DOCTYPE html>
<html lang="ja">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>カート - JEC Food Rescue</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

     <!-- 1. 共通ヘッダー / 公共顶栏 -->
     <div id="commonHeader"></div>

     <!-- 2. メインコンテンツ / 主内容区 -->
     <main class="container py-4 flex-grow-1" style="max-width: 600px;">

          <h1 class="h5 fw-bold mb-1">カート</h1>
          <p class="small text-secondary mb-3">店舗ごとに内容の確認・予約注文ができます（1店舗につき合計10点まで）。</p>

          <!-- 店舗カード① / 店铺卡片① -->
          <div class="card mb-3">
               <div class="card-header bg-light d-flex justify-content-between align-items-center py-2">
                    <span class="fw-bold small"><i class="bi bi-shop me-1"></i>ベーカリー太陽 新宿店</span>
                    <span class="badge bg-leaf">1点</span>
               </div>
               <div class="card-body p-3">
                    <div class="d-flex gap-3 align-items-start">
                         <!-- 商品画像プレースホルダー（DB連携時にimgタグへ差し替え） / 预留商品图位 -->
                         <div class="rounded border bg-light d-flex align-items-center justify-content-center flex-shrink-0 text-secondary"
                              style="width: 64px; height: 64px;">
                              <i class="bi bi-image fs-4"></i>
                         </div>

                         <div class="flex-grow-1">
                              <div class="d-flex justify-content-between align-items-start">
                                   <div>
                                        <div class="fw-bold small">北海道産バターのクロワッサン</div>
                                        <div class="small text-secondary">販売終了：20:00まで</div>
                                        <div class="fw-bold small mt-1">¥180</div>
                                   </div>
                                   <button type="button" class="btn btn-link text-secondary p-0" title="削除" onclick="this.closest('.card').remove()">
                                        <i class="bi bi-trash"></i>
                                   </button>
                              </div>
                         </div>
                    </div>

                    <hr class="my-2">

                    <div class="d-flex justify-content-between align-items-center mb-3">
                         <div class="input-group input-group-sm" style="width: 105px;">
                              <button class="btn btn-outline-secondary" type="button">-</button>
                              <input type="text" class="form-control text-center bg-white" value="1" readonly>
                              <button class="btn btn-outline-secondary" type="button">+</button>
                         </div>
                         <div class="fw-bold small">小計：¥180</div>
                    </div>

                    <a href="order_confirm.html" class="btn btn-brown w-100 fw-bold py-2">この店舗の注文手続きへ</a>
               </div>
          </div>

          <!-- 店舗カード② / 店铺卡片② -->
          <div class="card mb-4">
               <div class="card-header bg-light d-flex justify-content-between align-items-center py-2">
                    <span class="fw-bold small"><i class="bi bi-shop me-1"></i>キッチンみどり 西新宿店</span>
                    <span class="badge bg-leaf">1点</span>
               </div>
               <div class="card-body p-3">
                    <div class="d-flex gap-3 align-items-start">
                         <!-- 商品画像プレースホルダー（DB連携時にimgタグへ差し替え） / 预留商品图位 -->
                         <div class="rounded border bg-light d-flex align-items-center justify-content-center flex-shrink-0 text-secondary"
                              style="width: 64px; height: 64px;">
                              <i class="bi bi-image fs-4"></i>
                         </div>

                         <div class="flex-grow-1">
                              <div class="d-flex justify-content-between align-items-start">
                                   <div>
                                        <div class="fw-bold small">彩り幕の内弁当</div>
                                        <div class="small text-secondary">販売終了：20:00まで</div>
                                        <div class="fw-bold small mt-1">¥480</div>
                                   </div>
                                   <button type="button" class="btn btn-link text-secondary p-0" title="削除" onclick="this.closest('.card').remove()">
                                        <i class="bi bi-trash"></i>
                                   </button>
                              </div>
                         </div>
                    </div>

                    <hr class="my-2">

                    <div class="d-flex justify-content-between align-items-center mb-3">
                         <div class="input-group input-group-sm" style="width: 105px;">
                              <button class="btn btn-outline-secondary" type="button">-</button>
                              <input type="text" class="form-control text-center bg-white" value="1" readonly>
                              <button class="btn btn-outline-secondary" type="button">+</button>
                         </div>
                         <div class="fw-bold small">小計：¥480</div>
                    </div>

                    <a href="order_confirm.html" class="btn btn-brown w-100 fw-bold py-2">この店舗の注文手続きへ</a>
               </div>
          </div>

          <!-- 合計・買い物を続ける / 底部总计与继续购物 -->
          <div class="border-top pt-3">
               <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="small text-secondary">合計（2店舗・2点）</span>
                    <span class="fw-bold fs-5">¥660</span>
               </div>
               <a href="products.html" class="btn btn-outline-secondary w-100 py-2">買い物を続ける</a>
          </div>

     </main>

     <!-- 3. 共通フッター・ドロワー / 公共页脚与双抽屉 -->
     <div id="commonFooter"></div>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
     <script>sessionStorage.setItem('isLoggedIn', 'true');</script>
     <script src="js/auth-state.js"></script>
</body>

</html>
