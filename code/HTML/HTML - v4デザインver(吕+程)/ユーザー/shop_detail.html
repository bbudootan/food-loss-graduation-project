<!DOCTYPE html>
<html lang="ja">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>ベーカリー太陽 新宿店 - 店舗詳細 - JEC Food Rescue</title>
     <!-- Bootstrap 5 CSS -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <!-- Bootstrap Icons -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <!-- カスタムCSS / 自定义外部样式 -->
     <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

     <!-- 1. 共通ヘッダー挿入先 / 公共顶部导航栏占位 -->
     <div id="commonHeader"></div>

     <!-- 2. メインコンテンツ / 主内容区 -->
     <main class="container py-4 flex-grow-1">
          <!-- パンくずリスト / 面包屑导航 -->
          <nav aria-label="breadcrumb" class="mb-3">
               <ol class="breadcrumb small mb-0">
                    <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none text-secondary">ホーム</a></li>
                    <li class="breadcrumb-item"><a href="shops.html" class="text-decoration-none text-secondary">店舗一覧</a></li>
                    <li class="breadcrumb-item active text-dark fw-bold">ベーカリー太陽 新宿店</li>
               </ol>
          </nav>

          <!-- 店舗基本情報カード / 店铺头部基本资料卡片 -->
          <section class="card rounded-3 overflow-hidden mb-5">
               <div class="row g-0">
                    <!-- 左側：店舗写真枠 / 左侧：店铺图片区域 -->
                    <div class="col-12 col-md-5 d-flex align-items-center justify-content-center border-end" style="background-color: #F4EFE6; min-height: 220px;">
                         <span class="text-secondary"><i class="bi bi-shop fs-4 me-2"></i>店舗写真</span>
                    </div>
                    <!-- 右側：店舗詳細テキスト・テーブル / 右侧：店铺详细介绍与资料表格 -->
                    <div class="col-12 col-md-7">
                         <div class="card-body p-4">
                              <div class="d-flex align-items-center gap-2 mb-2">
                                   <span class="badge bg-leaf">営業中</span>
                                   <span class="small text-secondary">ベーカリー</span>
                              </div>
                              <h1 class="h4 fw-bold mb-2">ベーカリー太陽 新宿店</h1>
                              <p class="small text-secondary mb-3">
                                   北海道産小麦と天然酵母を使用し、毎朝店内で焼き上げる手作りベーカリーです。閉店前に残ってしまった美味しいパンをお得な価格でご提供しています。
                              </p>
                              <table class="table table-sm table-borderless small mb-0">
                                   <tbody>
                                        <tr><th class="text-secondary" style="width: 100px;">住所</th><td>東京都新宿区西新宿1-1-1</td></tr>
                                        <tr><th class="text-secondary">アクセス</th><td>JR新宿駅 西口より徒歩3分</td></tr>
                                        <tr><th class="text-secondary">営業時間</th><td>09:00 〜 20:30（レスキュー受取：17:00 〜 20:00）</td></tr>
                                        <tr><th class="text-secondary">定休日</th><td>毎週水曜日</td></tr>
                                   </tbody>
                              </table>
                         </div>
                    </div>
               </div>
          </section>

          <!-- この店舗の出品中商品一覧 / 该店铺正在出品的商品列表 -->
          <h2 class="h5 fw-bold mb-3">この店舗の出品中商品（3件）</h2>
          <div class="row g-3 mb-4" id="shopProductGrid"></div>

          <!-- 店舗一覧へ戻るボタン / 返回店铺一览按钮 -->
          <div class="text-center mt-3">
               <a href="shops.html" class="btn btn-outline-brown btn-sm px-4">&larr; 店舗一覧へ戻る</a>
          </div>
     </main>

     <!-- 3. 共通フッター・ドロワー挿入先 / 公共页脚与双抽屉占位 -->
     <div id="commonFooter"></div>

     <!-- Bootstrap 5 JS -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
     <!-- ログイン状態判定・共通UIスクリプト / 登录状态判断与公共交互脚本 -->
     <script src="js/auth-state.js"></script>
     <script>
          // 該当店舗の出品商品ダミーデータ（PHP化後は店舗IDで絞り込んで取得）
          // 该店铺正在出品的商品模拟数据（后续改用 PHP 后根据店铺 ID 查询数据库）
          const SHOP_PRODUCTS = [
               { name: '北海道産バターのクロワッサン', shop: 'ベーカリー太陽 新宿店', oldPrice: 300, price: 180, limit: '20:00', stock: 3, desc: '北海道産発酵バターを使用した当日焼き上げクロワッサン', amount: '2個入り（約120g）', allergen: '小麦・乳成分・卵', exp: '当日 22:00（消費期限）', storage: '常温保存' },
               { name: '特製ロースカツサンド', shop: 'ベーカリー太陽 新宿店', oldPrice: 550, price: 320, limit: '20:00', stock: 4, desc: 'やわらか三元豚のロースカツをふわふわ食パンで挟みました', amount: '3切れ入り', allergen: '小麦・豚肉・卵・大豆', exp: '当日 22:00（消費期限）', storage: '10℃以下で冷蔵保存' },
               { name: 'おまかせパン詰め合わせ袋', shop: 'ベーカリー太陽 新宿店', oldPrice: 1000, price: 500, limit: '20:00', stock: 0, desc: '当日焼き上げた菓子パン・惣菜パンの詰め合わせ', amount: '4〜5個入り', allergen: '小麦・卵・乳成分', exp: '当日 22:00', storage: '常温保存' }
          ];

          // 店舗内の商品カード一覧を描画 / 渲染该店铺的商品卡片列表
          document.getElementById('shopProductGrid').innerHTML = SHOP_PRODUCTS.map(p => {
               const soldout = p.stock === 0;
               return `
               <div class="col-12 col-md-4">
                    <div class="product-flip-card ${soldout ? 'product-soldout' : ''}">
                         <div class="product-flip-inner">
                              <!-- カード表面 / 卡片正面 -->
                              <div class="card product-flip-front">
                                   <div class="card-img-box border-bottom d-flex align-items-center justify-content-center">
                                        <span class="corner-ribbon">${soldout ? '売り切れ' : `残り：${p.stock}点`}</span>
                                        <button type="button" class="btn btn-link text-danger position-absolute top-0 end-0 m-1 p-1" hidden aria-label="お気に入り"><i class="bi bi-heart fs-5"></i></button>
                                        <span class="${soldout ? 'text-light' : 'text-secondary'} small"><i class="bi bi-image me-1"></i>商品写真</span>
                                   </div>
                                   <div class="card-body p-3 d-flex flex-column justify-content-between ${soldout ? 'soldout-disable' : ''}">
                                        <div>
                                             <h3 class="h6 fw-bold mb-1">${p.name}</h3>
                                             <div class="small ${soldout ? '' : 'text-secondary'} mb-1">${p.shop}</div>
                                             <div class="mb-1"><span class="small ${soldout ? '' : 'text-secondary'}">通常価格 <del>¥${p.oldPrice}</del></span> <span class="fw-bold mx-1">&gt;</span> <span class="fw-bold fs-5">¥${p.price}</span></div>
                                             <div class="small ${soldout ? '' : 'text-secondary'} mb-2">${p.limit}まで受取可</div>
                                        </div>
                                        <div>
                                             <div class="d-flex justify-content-between align-items-center mb-2">
                                                  <span class="small">購入数量</span>
                                                  <div class="btn-group btn-group-sm qty-control">
                                                       <button type="button" class="btn btn-outline-secondary btn-minus" ${soldout ? 'disabled' : ''}>-</button>
                                                       <span class="btn btn-outline-secondary disabled text-dark qty-val">1</span>
                                                       <button type="button" class="btn btn-outline-secondary btn-plus" data-max="${p.stock}" ${soldout ? 'disabled' : ''}>+</button>
                                                  </div>
                                             </div>
                                             <div class="d-grid mb-2"><button type="button" class="btn ${soldout ? 'btn-outline-secondary' : 'btn-outline-dark js-add-cart'} btn-sm" ${soldout ? 'disabled' : ''}><i class="bi bi-cart me-1"></i>カートに入れる</button></div>
                                             <div class="text-end">${soldout ? '<span class="small">商品について &rarr;</span>' : '<button type="button" class="flip-toggle-link js-flip-to-back">商品について &rarr;</button>'}</div>
                                        </div>
                                   </div>
                              </div>
                              <!-- カード裏面 / 卡片背面详情 -->
                              ${soldout ? '' : `
                              <div class="card product-flip-back">
                                   <div class="card-body p-4 d-flex flex-column justify-content-between">
                                        <div>
                                             <h4 class="h6 fw-bold border-bottom pb-2 mb-3">${p.name}</h4>
                                             <ul class="small ps-3 mb-0" style="line-height: 1.9;">
                                                  <li><strong>商品説明：</strong>${p.desc}</li>
                                                  <li><strong>内容量：</strong>${p.amount}</li>
                                                  <li><strong>アレルゲン：</strong>${p.allergen}</li>
                                                  <li><strong>食品期限：</strong>${p.exp}</li>
                                                  <li><strong>保存方法：</strong>${p.storage}</li>
                                             </ul>
                                        </div>
                                        <div class="text-end border-top pt-2"><button type="button" class="flip-toggle-link js-flip-to-front">商品に戻る &rarr;</button></div>
                                   </div>
                              </div>`}
                         </div>
                    </div>
               </div>`;
          }).join('');
     </script>

</body>
</html>
