<!DOCTYPE html>
<html lang="ja">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- 页面标题 -->
     <title>JEC Food Rescue - おいしさを、もう一度。</title>
     <!-- 引入 Bootstrap 5 样式库 -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <!-- 引入 Bootstrap 图标库 -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <!-- 引入拆分出来的外部自定义 CSS 样式 -->
     <link rel="stylesheet" href="css/style.css">
</head>

<body class="top-hero-bg d-flex flex-column min-vh-100">

     <!-- 主体居中展示区 -->
     <main class="container my-auto py-5">
          <div class="row justify-content-center">
               <div class="col-12 col-md-10 col-lg-8">

                    <!-- 半透明柔光主卡片 -->
                    <div class="hero-glass-card text-center px-4 py-5 p-md-5">

                         <!-- 1. Logo 图片（存放在外层 images/logo.png） -->
                         <div class="mb-4">
                              <img src="images/logo.png" alt="JEC Food Rescue おいしさを、もう一度。" class="img-fluid hero-logo">
                         </div>

                         <!-- 2. 惹句（与 Logo 缎带文字一致）与辅助说明副标语 -->
                         <h1 class="h2 fw-bold mb-3 hero-catchphrase">
                              おいしさを、もう一度。
                         </h1>
                         <p class="text-secondary mb-5 hero-subcopy">
                              近くのお店の商品を、おトクに見つけよう
                         </p>

                         <!-- 3. 普通用户入口：指向「ユーザー」文件夹 -->
                         <div class="mb-2">
                              <a href="ユーザー/index.html" class="btn btn-rescue-primary btn-lg px-5 py-3 fw-bold rounded-3">
                                   商品を探す <span class="ms-2">→</span>
                              </a>
                         </div>
                         <div class="mb-5">
                              <small class="text-secondary">ログインなしで閲覧できます</small>
                         </div>

                         <!-- 分隔线 -->
                         <hr class="w-50 mx-auto my-4 hero-divider">

                         <!-- 4. 底部双角色入口：分别指向「店舗関係者」和「システム管理者」文件夹 -->
                         <div class="d-flex flex-wrap justify-content-center align-items-center gap-4 gap-md-5 pt-2">
                              <a href="店舗関係者/login/login.html" class="text-decoration-none fw-bold role-link">
                                   店舗運営者の方 <span class="ms-1">→</span>
                              </a>
                              <a href="システム管理者/login/login.html" class="text-decoration-none fw-bold role-link">
                                   管理者の方 <span class="ms-1">→</span>
                              </a>
                         </div>

                    </div>

               </div>
          </div>
     </main>

     <!-- 最底部版本与版权信息 -->
     <footer class="text-center pb-4">
          <small class="text-secondary">v1.0 &nbsp; © 2026 JEC Food Rescue</small>
     </footer>

     <!-- 引入 Bootstrap 交互逻辑所需的 JavaScript 库 -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
