<svg xmlns="http://www.w3.org/2000/svg" width="304" height="576" class="svgbob"><style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
    stroke: black;
    stroke-width: 2;
    stroke-opacity: 1;
    fill-opacity: 1;
    stroke-linecap: round;
    stroke-linejoin: miter;
}
.svgbob text {
    white-space: pre;
    fill: black;
    font-family: Iosevka Fixed, monospace;
    font-size: 14px;
}
.svgbob rect.backdrop {
    stroke: none;
    fill: white;
}
.svgbob .broken {
    stroke-dasharray: 8;
}
.svgbob .filled {
    fill: black;
}
.svgbob .bg_filled {
    fill: white;
    stroke-width: 1;
}
.svgbob .nofill {
    fill: white;
}
.svgbob .end_marked_arrow {
    marker-end: url(#arrow);
}
.svgbob .start_marked_arrow {
    marker-start: url(#arrow);
}
.svgbob .end_marked_diamond {
    marker-end: url(#diamond);
}
.svgbob .start_marked_diamond {
    marker-start: url(#diamond);
}
.svgbob .end_marked_circle {
    marker-end: url(#circle);
}
.svgbob .start_marked_circle {
    marker-start: url(#circle);
}
.svgbob .end_marked_open_circle {
    marker-end: url(#open_circle);
}
.svgbob .start_marked_open_circle {
    marker-start: url(#open_circle);
}
.svgbob .end_marked_big_open_circle {
    marker-end: url(#big_open_circle);
}
.svgbob .start_marked_big_open_circle {
    marker-start: url(#big_open_circle);
}<!--separator--></style><defs><marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 0,4 4,2 0,0"></polygon></marker><marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,2 2,0 4,2 2,4 0,2"></polygon></marker><marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><circle cx="4" cy="4" r="2" class="filled"></circle></marker><marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><circle cx="4" cy="4" r="2" class="bg_filled"></circle></marker><marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><circle cx="4" cy="4" r="3" class="bg_filled"></circle></marker></defs><rect class="backdrop" x="0" y="0" width="304" height="576"></rect><rect x="4" y="8" width="288" height="256" class="solid nofill" rx="0"></rect><rect x="20" y="24" width="256" height="96" class="solid nofill" rx="0"></rect><text x="258" y="44" >♡</text><text x="114" y="76" >店</text><text x="130" y="76" >舗</text><text x="146" y="76" >写</text><text x="162" y="76" >真</text><text x="18" y="156" >店</text><text x="18" y="172" >ジ</text><text x="18" y="188" >エ</text><text x="18" y="204" >営</text><text x="18" y="220" >出</text><text x="34" y="156" >舗</text><text x="34" y="172" >ャ</text><text x="34" y="188" >リ</text><text x="34" y="204" >業</text><text x="34" y="220" >品</text><text x="50" y="156" >名</text><text x="50" y="172" >ン</text><text x="50" y="188" >ア</text><text x="50" y="204" >時</text><text x="50" y="220" >中</text><text x="66" y="172" >ル</text><text x="66" y="204" >間</text><text x="66" y="220" >：</text><line x1="96" y1="192" x2="88" y2="208" class="solid"></line><text x="106" y="204" >受</text><line x1="80" y1="224" x2="96" y2="224" class="solid">