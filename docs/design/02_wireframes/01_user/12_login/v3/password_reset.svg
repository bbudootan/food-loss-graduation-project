<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" class="svgbob"><style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
    stroke: black;
    stroke-width: 2;
    stroke-opacity: 1;
    fill-opacity: 1;
    stroke-linecap: round;
    stroke-linejoin: miter;
}
.svgbob text {
    white-space: pre;
    fill: black;
    font-family: Iosevka Fixed, monospace;
    font-size: 14px;
}
.svgbob rect.backdrop {
    stroke: none;
    fill: white;
}
.svgbob .broken {
    stroke-dasharray: 8;
}
.svgbob .filled {
    fill: black;
}
.svgbob .bg_filled {
    fill: white;
    stroke-width: 1;
}
.svgbob .nofill {
    fill: white;
}
.svgbob .end_marked_arrow {
    marker-end: url(#arrow);
}
.svgbob .start_marked_arrow {
    marker-start: url(#arrow);
}
.svgbob .end_marked_diamond {
    marker-end: url(#diamond);
}
.svgbob .start_marked_diamond {
    marker-start: url(#diamond);
}
.svgbob .end_marked_circle {
    marker-end: url(#circle);
}
.svgbob .start_marked_circle {
    marker-start: url(#circle);
}
.svgbob .end_marked_open_circle {
    marker-end: url(#open_circle);
}
.svgbob .start_marked_open_circle {
    marker-start: url(#open_circle);
}
.svgbob .end_marked_big_open_circle {
    marker-end: url(#big_open_circle);
}
.svgbob .start_marked_big_open_circle {
    marker-start: url(#big_open_circle);
}<!--separator--></style><defs><marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 0,4 4,2 0,0"></polygon></marker><marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,2 2,0 4,2 2,4 0,2"></polygon></marker><marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><circle cx="4" cy="4" r="2" class="filled"></circle></marker><marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><circle cx="4" cy="4" r="2" class="bg_filled"></circle></marker><marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><circle cx="4" cy="4" r="3" class="bg_filled"></circle></marker></defs><rect class="backdrop" x="0" y="0" width="480" height="160"></rect><rect x="4" y="8" width="464" height="128" class="solid nofill" rx="0"></rect><text x="386" y="44" >]</text><text x="154" y="60" >信</text><text x="170" y="60" >]</text><text x="186" y="60" >[ロ</text><text x="210" y="60" >グ</text><text x="226" y="60" >イ</text><text x="242" y="60" >ン</text><text x="258" y="60" >に</text><text x="274" y="60" >戻</text><text x="290" y="60" >る</text><text x="306" y="60" >]</text><text x="210" y="92" >合</text><text x="210" y="108" >ド</text><line x1="240" y1="96" x2="232" y2="112" class="solid"></line><text x="322" y="92" >案</text><line x1="328" y1="96" x2="320" y2="112" class="solid"></line><text x="434" y="92" >す</text><text x="450" y="92" >。</text><g><text x="18" y="28">パ</text><text x="34" y="28">ス</text><text x="50" y="28">ワ</text><text x="66" y="28">ー</text><text x="82" y="28">ド</text><text x="98" y="28">の</text><text x="114" y="28">再</text><text x="130" y="28">設</text><text x="146" y="28">定</text></g><g><text x="18" y="44">メ</text><text x="34" y="