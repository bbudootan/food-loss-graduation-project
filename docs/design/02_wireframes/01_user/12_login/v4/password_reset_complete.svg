<svg xmlns="http://www.w3.org/2000/svg" width="648" height="288" class="svgbob"><style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
    stroke: black;
    stroke-width: 2;
    stroke-opacity: 1;
    fill-opacity: 1;
    stroke-linecap: round;
    stroke-linejoin: miter;
}
.svgbob text {
    white-space: pre;
    fill: black;
    font-family: Iosevka Fixed, monospace;
    font-size: 14px;
}
.svgbob rect.backdrop {
    stroke: none;
    fill: white;
}
.svgbob .broken {
    stroke-dasharray: 8;
}
.svgbob .filled {
    fill: black;
}
.svgbob .bg_filled {
    fill: white;
    stroke-width: 1;
}
.svgbob .nofill {
    fill: white;
}
.svgbob .end_marked_arrow {
    marker-end: url(#arrow);
}
.svgbob .start_marked_arrow {
    marker-start: url(#arrow);
}
.svgbob .end_marked_diamond {
    marker-end: url(#diamond);
}
.svgbob .start_marked_diamond {
    marker-start: url(#diamond);
}
.svgbob .end_marked_circle {
    marker-end: url(#circle);
}
.svgbob .start_marked_circle {
    marker-start: url(#circle);
}
.svgbob .end_marked_open_circle {
    marker-end: url(#open_circle);
}
.svgbob .start_marked_open_circle {
    marker-start: url(#open_circle);
}
.svgbob .end_marked_big_open_circle {
    marker-end: url(#big_open_circle);
}
.svgbob .start_marked_big_open_circle {
    marker-start: url(#big_open_circle);
}<!--separator--></style><defs><marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 0,4 4,2 0,0"></polygon></marker><marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,2 2,0 4,2 2,4 0,2"></polygon></marker><marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><circle cx="4" cy="4" r="2" class="filled"></circle></marker><marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><circle cx="4" cy="4" r="2" class="bg_filled"></circle></marker><marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><circle cx="4" cy="4" r="3" class="bg_filled"></circle></marker></defs><rect class="backdrop" x="0" y="0" width="648" height="288"></rect><rect x="4" y="8" width="632" height="256" class="solid nofill" rx="0"></rect><rect x="108" y="72" width="440" height="128" class="solid nofill" rx="0"></rect><text x="138" y="124" >新</text><text x="138" y="140" >次</text><text x="154" y="124" >し</text><text x="154" y="140" >回</text><text x="170" y="124" >い</text><text x="170" y="140" >か</text><text x="186" y="124" >パ</text><text x="186" y="140" >ら</text><text x="202" y="124" >ス</text><text x="202" y="140" >新</text><text x="218" y="124" >ワ</text><text x="218" y="140" >し</text><text x="234" y="124" >ー</text><text x="234" y="140" >い</text><text x="250" y="124" >ド</text><text x="250" y="140" >パ</text><text x="266" y="124" >を</text><text x="266" y="140" >ス</text><text x="282" y="124" >設</text><text x="282" y="140" >ワ</text><text x="298" y="124" >定</text><text x="298" y="140" >ー</text><text x="314" y="124" >し</text><text x="314" y="140" >ド</text><text x="330" y="124" >ま</text><text x="330" y="140" >で</text><text x="346" y="124" >し</te